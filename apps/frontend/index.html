<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone Configurator</title>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <header>
      <h1>Drone Configurator</h1>
      <form id="connect">
        <select id="transport" aria-label="Transport">
          <option value="simulator">Simulator</option>
          <option value="udp">UDP</option>
          <option value="tcp">TCP</option>
          <option value="serial">Serial</option>
        </select>
        <input id="host" placeholder="127.0.0.1" aria-label="Host" />
        <input id="port" placeholder="14550" inputmode="numeric" aria-label="Port" />
        <select id="device" aria-label="Serial port" hidden></select>
        <select id="baud" aria-label="Baud rate" hidden>
          <option>57600</option>
          <option selected>115200</option>
          <option>230400</option>
          <option>460800</option>
          <option>921600</option>
        </select>
        <button id="connect-button" type="submit">Connect</button>
        <button id="disconnect-button" type="button">Disconnect</button>
      </form>
      <p id="connection"></p>
    </header>
    <section id="telemetry" class="cards"></section>
    <main>
      <section class="params">
        <div class="toolbar">
          <input id="filter" placeholder="Filter parameters" aria-label="Filter parameters" autocomplete="off" />
          <button id="refresh" type="button">Download</button>
          <button id="save" type="button">Save snapshot</button>
          <label id="load-button" class="button">Load snapshot<input id="load" type="file" accept=".json,application/json" hidden /></label>
          <label id="metadata-button" class="button">Load metadata<input id="metadata" type="file" accept=".json,application/json" hidden /></label>
        </div>
        <p id="metadata-status" class="muted"></p>
        <section id="import-panel" hidden>
          <div id="import"></div>
          <button id="apply" type="button">Write the ticked changes</button>
          <button id="backup" type="button">Save the backup</button>
          <button id="close-import" type="button">Close</button>
        </section>
        <p id="list-status" class="muted"></p>
        <table>
          <thead><tr><th>Name</th><th>Value</th><th>Type</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
      <aside class="detail">
        <div id="detail"></div>
        <form id="edit">
          <input id="draft" aria-label="New value" autocomplete="off" />
          <button id="write" type="submit">Write</button>
        </form>
      </aside>
    </main>
    <div id="confirm-root"></div>
  </body>
</html>
