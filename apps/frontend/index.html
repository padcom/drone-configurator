<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone Configurator</title>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <header>
      <h1>Drone Configurator</h1>
      <div id="connection-bar"></div>
    </header>
    <section id="telemetry" class="cards"></section>
    <main>
      <section class="params">
        <div class="toolbar">
          <div id="param-filter" class="inline"></div>
          <button id="save" type="button">Save snapshot</button>
          <label id="load-button" class="button">Load snapshot<input id="load" type="file" accept=".json,application/json" hidden /></label>
          <label id="metadata-button" class="button">Load metadata<input id="metadata" type="file" accept=".json,application/json" hidden /></label>
        </div>
        <div id="metadata-status-root" class="inline"></div>
        <section id="import-panel" hidden>
          <div id="import"></div>
          <button id="apply" type="button">Write the ticked changes</button>
          <button id="backup" type="button">Save the backup</button>
          <button id="close-import" type="button">Close</button>
        </section>
        <div id="param-table"></div>
      </section>
      <aside class="detail">
        <div id="param-editor"></div>
      </aside>
    </main>
    <div id="confirm-root"></div>
  </body>
</html>
