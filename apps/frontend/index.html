<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone Configurator</title>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <header>
      <h1>Drone Configurator</h1>
      <div id="connection-bar"></div>
    </header>
    <section id="telemetry" class="cards"></section>
    <main>
      <section class="params">
        <div class="toolbar">
          <div id="param-filter" class="inline"></div>
          <div id="snapshot-toolbar" class="inline"></div>
        </div>
        <div id="metadata-status-root" class="inline"></div>
        <div id="snapshot-import"></div>
        <div id="param-table"></div>
      </section>
      <aside class="detail">
        <div id="param-editor"></div>
      </aside>
    </main>
    <div id="confirm-root"></div>
  </body>
</html>
