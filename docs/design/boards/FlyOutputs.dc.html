<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fly: outputs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A0F14}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #56D9F2;outline-offset:2px}
</style>
<style data-shell>
[data-l~="measure"]>*{max-width:var(--measure)}
@media (min-width:1000px){
html:has([data-l~="app"]),body:has([data-l~="app"]){height:100%;overflow:hidden}
[data-l~="app"]{height:100vh;min-height:0!important;overflow:hidden}
[data-l~="row"]{flex-wrap:nowrap!important;min-height:0}
[data-l~="fill"]{flex:1 1 0!important;min-height:0}
[data-l~="clip"]{min-height:0;overflow:hidden}
[data-l~="pane"]{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#60728A transparent}
[data-l~="pane"][data-l~="col"]>*:not([data-l~="map"]){flex-shrink:0!important}
[data-l~="map"]{min-width:0;min-height:240px!important}
}
</style>
</helmet>
<div data-l="app" style="min-height:900px;display:flex;flex-direction:column;background:#0A0F14;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.4">
  <dc-import name="TopBar" status="armed" hint-size="100%,64px"></dc-import>
  <div data-l="row fill" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:stretch">
    <div data-l="pane" style="flex:1 1 76px;background:#111921;border-right:1px solid #25323E"><dc-import name="Rail" active="fly" hint-size="76px,640px"></dc-import></div>
    <main data-l="clip" style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
      <dc-import name="FlyNav" active="outputs" hint-size="100%,56px"></dc-import>
      <div data-l="fill pane" style="flex:1 1 auto;display:flex;flex-wrap:wrap;gap:28px;padding:24px 28px;align-content:flex-start">
        <section style="flex:2 1 460px;min-width:0;display:flex;flex-direction:column;gap:8px">
          <h1 style="margin:0 0 6px;font-size:24px;font-weight:600">Servos</h1>
          <sc-for list="{{servos}}" as="o" hint-placeholder-count="6">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-height:56px;padding:6px 12px;background:#111921;border:1px solid #25323E;border-radius:5px">
              <span style="width:24px;font-family:'IBM Plex Mono',monospace;font-weight:600">{{o.no}}</span>
              <span style="width:140px;font-weight:500">{{o.name}}</span>
              <sc-if value="{{o.free}}" hint-placeholder-val="{{true}}">
                <input type="range" aria-label="{{o.name}} output" min="1000" max="2000" step="10" value="{{o.pwm}}" onChange="{{o.change}}" style="flex:1 1 200px;accent-color:#56D9F2;min-height:40px;margin:0">
                <span style="width:60px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px">{{o.pwm}}</span>
              </sc-if>
              <sc-if value="{{o.motor}}" hint-placeholder-val="{{false}}"><span style="flex:1 1 200px;color:#A9B8C5;font-size:13px">Drives a motor, so it can't be set here.</span></sc-if>
            </div>
          </sc-for>
        </section>
        <section style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:10px">
          <h2 style="margin:0;font-size:12px;font-weight:600;letter-spacing:.09em;color:#A9B8C5">RELAYS</h2>
          <sc-for list="{{relays}}" as="r" hint-placeholder-count="2">
            <button type="button" aria-pressed="{{r.on}}" onClick="{{r.toggle}}" style="display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 14px;border:1px solid {{r.border}};border-radius:5px;background:{{r.bg}};color:#E8EEF4;font:inherit;font-weight:500;cursor:pointer"><span>{{r.name}}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:{{r.fg}}">{{r.state}}</span></button>
          </sc-for>
          <h2 style="margin:12px 0 0;font-size:12px;font-weight:600;letter-spacing:.09em;color:#A9B8C5">SWITCH FUNCTIONS</h2>
          <dc-import name="EnumField" value="{{fn}}" options="{{fns}}" on-pick="{{fnPick}}" field-label="Function" hint-size="100%,44px"></dc-import>
          <div role="group" aria-label="Position" style="display:flex;border:1px solid #60728A;border-radius:4px;overflow:hidden">
            <sc-for list="{{positions}}" as="b" hint-placeholder-count="3"><button type="button" onClick="{{b.pick}}" style="flex:1;min-height:48px;border:0;background:{{b.bg}};color:{{b.fg}};font:inherit;font-weight:600;cursor:pointer">{{b.label}}</button></sc-for>
          </div>
          <span style="color:#A9B8C5;font-size:13px">{{sent}}</span>
        </section>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { pwm:{ 5:1500, 6:1100 }, relays:{ 0:false, 1:true }, fn:9, sent:'' };
  renderVals() {
    const s = this.state;
    const D = [[1,'Motor 1'],[2,'Motor 2'],[3,'Motor 3'],[4,'Motor 4'],[5,'Landing light'],[6,'Payload release']];
    const fnName = (v) => ({ 4:'Return home', 9:'Camera trigger', 18:'Land', 29:'Landing gear' }[v] ?? 'Function '+v);
    return {
      servos:D.map(([no,name]) => { const motor = no<=4; return { no,name,motor,free:!motor,pwm:s.pwm[no],change:(e) => this.setState({ pwm:{ ...s.pwm, [no]:Number(e.target.value) } }) }; }),
      relays:[[0,'Work lights'],[1,'Camera power']].map(([id,name]) => { const on = s.relays[id]; return { name,on,state:on?'ON':'OFF',fg:on?'#56D9F2':'#A9B8C5',border:on?'#56D9F2':'#25323E',bg:on?'#123440':'#111921',toggle:() => this.setState({ relays:{ ...s.relays, [id]:!on } }) }; }),
      fn:s.fn, fnPick:(n) => this.setState({ fn:n }),
      fns:[[4,'Return home'],[9,'Camera trigger'],[18,'Land'],[29,'Landing gear']].map(([value,label]) => ({ value,label })),
      positions:['Low','Middle','High'].map((label) => ({ label, bg:s.sent.includes(label)?'#56D9F2':'transparent', fg:s.sent.includes(label)?'#06222B':'#E8EEF4', pick:() => this.setState({ sent:'✓ '+fnName(s.fn)+' set to '+label+' on Quad 1' }) })),
      sent:s.sent || 'Sends the function as if a transmitter switch had moved.',
    };
  }
}
</script>
</body>
</html>
