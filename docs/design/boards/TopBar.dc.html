<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<header style="display:flex;flex-wrap:wrap;align-items:stretch;min-height:64px;background:{{t.panel}};border-bottom:1px solid {{t.line}};color:{{t.text}};font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.3">
  <a href="Main.dc.html" aria-label="Overview" style="flex:0 0 76px;display:flex;align-items:center;justify-content:center;color:{{t.accent}};border-right:1px solid {{t.line}}">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="5.5" cy="5.5" r="3"></circle><circle cx="18.5" cy="5.5" r="3"></circle><circle cx="5.5" cy="18.5" r="3"></circle><circle cx="18.5" cy="18.5" r="3"></circle><path d="m8 8 8 8M16 8l-8 8"></path></svg>
  </a>
  <a href="Connect.dc.html" style="display:flex;align-items:center;gap:12px;padding:8px 18px;min-width:230px;box-sizing:border-box;border-right:1px solid {{t.line}};color:{{t.text}};text-decoration:none;background:{{linkBg}}">
    <span aria-hidden="true" style="width:10px;height:10px;border-radius:50%;background:{{dot}};box-shadow:0 0 0 4px {{dotRing}}"></span>
    <span style="display:flex;flex-direction:column;flex:1">
      <span style="font-weight:600;font-size:15px;color:{{linkFg}}">{{linkTitle}}</span>
      <span style="font-size:12px;color:{{t.text2}}">{{linkSub}}</span>
    </span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="margin-right:-4px"><path d="m6 9 6 6 6-6"></path></svg>
  </a>
  <sc-for list="{{cells}}" as="c" hint-placeholder-count="5">
    <div style="display:flex;flex-direction:column;justify-content:center;padding:8px 18px;border-right:1px solid {{t.line}};background:{{c.bg}};color:{{c.fg}}">
      <span style="font-size:11px;font-weight:500;letter-spacing:.08em;color:{{c.labelFg}}">{{c.label}}</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600">{{c.value}}</span>
    </div>
  </sc-for>
  <div style="flex:1 1 auto;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:8px 16px;flex-wrap:wrap">
    <a href="Palette.dc.html" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;box-sizing:border-box;border:1px solid {{t.line2}};border-radius:4px;color:{{t.text2}};text-decoration:none;font-size:13px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <span>Search or run a command</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;border:1px solid {{t.line2}};border-radius:2px;padding:1px 6px">Ctrl K</span>
    </a>
    <a href="Connect.dc.html" style="display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;box-sizing:border-box;border:1px solid {{t.line2}};border-radius:4px;color:{{t.text}};text-decoration:none;font-size:13px;font-weight:500">Disconnect</a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"status":{"editor":"enum","options":["disarmed","armed","lost"],"default":"disarmed"},"vehicle":{"editor":"enum","options":["copter","plane","rover"],"default":"copter"},"$preview":{"width":1440,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const status = this.props.status ?? 'disarmed';
    const t = { panel:'#111921', line:'#25323E', line2:'#60728A', text:'#E8EEF4', text2:'#A9B8C5', accent:'#56D9F2', green:'#62E3A6', greenBg:'#123327', amber:'#FFB54A', amberBg:'#3A2A10' };
    const plain = (label, value) => ({ label, value, bg:'transparent', fg:t.text, labelFg:t.text2 });
    let cells;
    if (status === 'lost') {
      cells = [plain('MODE','—'), plain('STATE','—'), plain('BATTERY','—'), plain('GPS','—'), plain('LINK','—')];
    } else if (status === 'armed') {
      cells = [plain('MODE', this.props.mode ?? 'AUTO'), { label:'STATE', value:'ARMED', bg:'#FFB54A', fg:'#241600', labelFg:'#241600' }, plain('BATTERY', this.props.battery ?? '87%'), plain('GPS','3D · 14'), plain('LINK','98%')];
    } else {
      cells = [plain('MODE', this.props.mode ?? 'LOITER'), plain('STATE','DISARMED'), plain('BATTERY','94%'), plain('GPS', this.props.gps ?? '3D · 14'), plain('LINK','100%')];
    }
    const lost = status === 'lost';
    const v = { copter:['Quad 1','ArduCopter'], plane:['Plane 1','ArduPlane'], rover:['Rover 1','ArduRover'], sub:['Sub 1','ArduSub'], heli:['Heli 1','ArduCopter Heli'] }[this.props.vehicle ?? 'copter'];
    return {
      t, cells,
      linkTitle: lost ? 'reconnecting' : (this.props.vehicleName ?? v[0]),
      linkSub: lost ? 'try 3, the next in 4 s' : v[1] + ' · system 1/1 · Simulator',
      linkBg: lost ? t.amberBg : 'transparent',
      linkFg: lost ? t.amber : t.text,
      dot: lost ? t.amber : t.green,
      dotRing: lost ? 'transparent' : t.greenBg,
    };
  }
}
</script>
</body>
</html>
