<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tune: filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A0F14}
a{color:#56D9F2}a:hover{color:#8FE7F7}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #56D9F2;outline-offset:2px}
</style>
<style data-shell>
[data-l~="measure"]>*{max-width:var(--measure)}
@media (min-width:1000px){
html:has([data-l~="app"]),body:has([data-l~="app"]){height:100%;overflow:hidden}
[data-l~="app"]{height:100vh;min-height:0!important;overflow:hidden}
[data-l~="row"]{flex-wrap:nowrap!important;min-height:0}
[data-l~="fill"]{flex:1 1 0!important;min-height:0}
[data-l~="clip"]{min-height:0;overflow:hidden}
[data-l~="pane"]{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#60728A transparent}
[data-l~="pane"][data-l~="col"]>*:not([data-l~="map"]){flex-shrink:0!important}
[data-l~="map"]{min-width:0;min-height:240px!important}
}
</style>
</helmet>
<div data-l="app" style="min-height:900px;display:flex;flex-direction:column;background:#0A0F14;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.4">
  <dc-import name="TopBar" status="disarmed" hint-size="100%,64px"></dc-import>
  <div data-l="row fill" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:stretch">
    <div data-l="pane" style="flex:1 1 76px;background:#111921;border-right:1px solid #25323E"><dc-import name="Rail" active="tune" hint-size="76px,640px"></dc-import></div>
    <main data-l="row" style="flex:999 1 560px;min-width:0;display:flex;flex-wrap:wrap;align-items:stretch">
      <section data-l="pane col" style="flex:999 1 520px;min-width:0;box-sizing:border-box;padding:24px 28px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between">
          <h1 style="margin:0;font-size:28px;font-weight:600">Noise filters</h1>
          <a href="Tune.dc.html">Back to Tune</a>
        </div>
        <figure style="margin:0;flex:1 1 360px;display:flex;flex-direction:column;gap:8px;padding:14px 16px;background:#111921;border:1px solid #25323E;border-radius:5px">
          <figcaption style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12.5px;color:#A9B8C5">
            <span style="font-weight:600;color:#E8EEF4;font-size:14px">Gyro noise, Hz</span>
            <span style="display:inline-flex;align-items:center;gap:6px"><span aria-hidden="true" style="width:16px;height:2px;background:#56D9F2"></span>After filters</span>
            <span style="display:inline-flex;align-items:center;gap:6px"><span aria-hidden="true" style="width:16px;border-top:2px dashed #A9B8C5"></span>Before</span>
            <span style="flex:1 1 auto"></span><span style="font-family:'IBM Plex Mono',monospace;color:#E8EEF4">{{readout}}</span>
          </figcaption>
          <div onMouseMove="{{hoverMove}}" onMouseLeave="{{hoverOut}}" style="position:relative;flex:1 1 300px;min-height:300px">
            <svg viewBox="0 0 1000 300" preserveAspectRatio="none" role="img" aria-label="{{aria}}" style="position:absolute;inset:0;width:100%;height:100%">
              <polyline points="{{raw}}" fill="none" stroke="#A9B8C5" stroke-width="1.5" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"></polyline>
              <polyline points="{{filt}}" fill="none" stroke="#56D9F2" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
              <line x1="{{hx}}" x2="{{hx}}" y1="0" y2="300" stroke="#E8EEF4" stroke-opacity="{{ho}}" vector-effect="non-scaling-stroke"></line>
            </svg>
          </div>
          <div style="display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#A9B8C5"><span>0</span><span>100</span><span>200</span><span>300 Hz</span></div>
        </figure>
        <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 16px;background:#111921;border:1px solid #25323E;border-radius:5px">
          <div style="flex:1 1 280px"><div style="font-weight:600">Capture noise in flight</div><div style="font-size:13px;color:#A9B8C5">Logs raw gyro data on the next flight, for Logs → Spectrum.</div></div>
          <label style="display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer"><input type="checkbox" checked="{{capture}}" onChange="{{captureChange}}" style="width:20px;height:20px;accent-color:#56D9F2;margin:0">Capture</label>
          <a href="LogsSpectrum.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid #60728A;border-radius:4px;color:#E8EEF4;font-weight:500;text-decoration:none">Open Spectrum</a>
        </div>
      </section>
      <aside data-l="pane col" style="flex:1 1 320px;min-width:0;box-sizing:border-box;background:#111921;border-left:1px solid #25323E;padding:20px;display:flex;flex-direction:column;gap:12px">
        <label style="display:flex;gap:12px;align-items:center;min-height:44px;cursor:pointer;font-weight:500"><input type="checkbox" checked="{{on}}" onChange="{{onChange}}" style="width:20px;height:20px;accent-color:#56D9F2;margin:0"><span>Harmonic notch is on</span></label>
        <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A9B8C5">The notch follows
          <span style="position:relative;display:block">
            <select value="{{track}}" onChange="{{trackChange}}" style="width:100%;box-sizing:border-box;appearance:none;-webkit-appearance:none;min-height:48px;padding:0 38px 0 12px;border:1px solid #60728A;border-radius:4px;background:#0A0F14;color:#E8EEF4;font:inherit;font-size:15px">
              <sc-for list="{{tracks}}" as="o" hint-placeholder-count="4"><option value="{{o}}">{{o}}</option></sc-for>
            </select>
            <svg width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="#A9B8C5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position:absolute;right:13px;top:50%;margin-top:-4px;pointer-events:none"><path d="M1 1.5 6 6.5 11 1.5"></path></svg>
          </span>
        </label>
        <sc-for list="{{sliders}}" as="f" hint-placeholder-count="3">
          <label style="display:flex;flex-direction:column;font-size:13px;color:#A9B8C5"><span style="display:flex;justify-content:space-between"><span>{{f.label}}</span><span style="font-family:'IBM Plex Mono',monospace;color:#E8EEF4;font-size:15px">{{f.value}} Hz</span></span><input type="range" min="{{f.min}}" max="{{f.max}}" step="1" value="{{f.value}}" onChange="{{f.change}}" style="accent-color:#56D9F2;min-height:40px;margin:0"></label>
        </sc-for>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#A9B8C5;display:flex;flex-direction:column;gap:4px"><span>INS_HNTCH_ENABLE, _MODE</span><span>INS_HNTCH_FREQ, _BW</span><span>INS_GYRO_FILTER</span><span>INS_LOG_BAT_MASK</span></div>
        <button type="button" onClick="{{write}}" style="min-height:48px;margin-top:auto;border:0;border-radius:4px;background:#56D9F2;color:#06222B;font:inherit;font-weight:600;cursor:pointer">{{writeLabel}}</button>
      </aside>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { on:true, freq:82, bw:41, lpf:80, track:'Throttle', capture:false, written:false, hover:null };
  renderVals() {
    const s = this.state;
    const g = (f,c,w) => Math.exp(-Math.pow((f-c)/w,2));
    const noise = (f) => .06+.03*Math.sin(f*.37)+1*g(f,82,6)+.5*g(f,164,7)+.25*g(f,246,8);
    const lp = (f) => 1/Math.sqrt(1+Math.pow(f/s.lpf,4));
    const notch = (f) => s.on ? [1,2,3].reduce((a,h) => a*(1-.95*g(f,s.freq*h,s.bw*.25)),1) : 1;
    const filt = (f) => noise(f)*lp(f)*notch(f);
    const Y = (v) => (300-v/1.3*280).toFixed(1);
    let raw = '', fl = '';
    for (let f = 0; f <= 300; f += 1) { raw += (f/300*1000).toFixed(0)+','+Y(noise(f))+' '; fl += (f/300*1000).toFixed(0)+','+Y(filt(f))+' '; }
    const set = (k) => (e) => this.setState({ [k]:Number(e.target.value), written:false });
    const h = s.hover, hf = h==null?null:Math.round(h*300);
    return {
      raw:raw.trim(), filt:fl.trim(), on:s.on, track:s.track, capture:s.capture,
      aria:'Gyro noise before and after filtering, notch at '+s.freq+' hertz',
      readout:hf==null?'Peak left '+filt(82).toFixed(2):hf+' Hz · before '+noise(hf).toFixed(2)+' · after '+filt(hf).toFixed(2),
      hoverMove:(e) => { const r = e.currentTarget.getBoundingClientRect(); this.setState({ hover:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)) }); },
      hoverOut:() => this.setState({ hover:null }), hx:h==null?0:(h*1000).toFixed(0), ho:h==null?0:.7,
      onChange:(e) => this.setState({ on:e.target.checked, written:false }),
      tracks:['Throttle','RPM sensor','ESC telemetry','In-flight FFT'], trackChange:(e) => this.setState({ track:e.target.value, written:false }),
      captureChange:(e) => this.setState({ capture:e.target.checked }),
      sliders:[
        { label:'Notch centre',min:30,max:200,value:s.freq,change:set('freq') },
        { label:'Notch width',min:10,max:80,value:s.bw,change:set('bw') },
        { label:'Gyro low-pass',min:20,max:200,value:s.lpf,change:set('lpf') },
      ],
      write:() => this.setState({ written:true }), writeLabel:s.written?'✓ Written and read back':'Write and verify',
    };
  }
}
</script>
</body>
</html>
