<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fly: fleet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A0F14}
a{color:#56D9F2}a:hover{color:#8FE7F7}
a:focus-visible,button:focus-visible{outline:2px solid #56D9F2;outline-offset:2px}
</style>
<style data-shell>
[data-l~="measure"]>*{max-width:var(--measure)}
@media (min-width:1000px){
html:has([data-l~="app"]),body:has([data-l~="app"]){height:100%;overflow:hidden}
[data-l~="app"]{height:100vh;min-height:0!important;overflow:hidden}
[data-l~="row"]{flex-wrap:nowrap!important;min-height:0}
[data-l~="fill"]{flex:1 1 0!important;min-height:0}
[data-l~="clip"]{min-height:0;overflow:hidden}
[data-l~="pane"]{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#60728A transparent}
[data-l~="pane"][data-l~="col"]>*:not([data-l~="map"]){flex-shrink:0!important}
[data-l~="map"]{min-width:0;min-height:240px!important}
}
</style>
</helmet>
<div data-l="app" style="min-height:900px;display:flex;flex-direction:column;background:#0A0F14;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.4">
  <dc-import name="TopBar" status="armed" vehicleName="{{selName}}" mode="{{selMode}}" battery="{{selBatt}}" hint-size="100%,64px"></dc-import>
  <div data-l="row fill" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:stretch">
    <div data-l="pane" style="flex:1 1 76px;background:#111921;border-right:1px solid #25323E"><dc-import name="Rail" active="fly" hint-size="76px,640px"></dc-import></div>
    <main data-l="row" style="flex:999 1 560px;min-width:0;display:flex;flex-wrap:wrap;align-items:stretch">
      <section data-l="clip" style="flex:999 1 520px;min-width:0;display:flex;flex-direction:column">
        <dc-import name="FlyNav" active="fleet" hint-size="100%,56px"></dc-import>
        <div data-l="fill map" style="flex:1 1 520px;min-height:520px;position:relative;overflow:hidden">
          <dc-import name="MapBase" hint-size="100%,520px"></dc-import>
          <svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="{{aria}}" style="position:absolute;inset:0;width:100%;height:100%">
            <circle cx="250" cy="700" r="24" fill="#10171E" stroke="#62E3A6" stroke-width="4"></circle>
            <text x="250" y="710" text-anchor="middle" fill="#62E3A6" font-family="IBM Plex Mono, monospace" font-size="28" font-weight="600">H</text>
            <sc-for list="{{vehicles}}" as="v" hint-placeholder-count="4">
              <g onClick="{{v.pick}}" style="cursor:pointer">
                <circle cx="{{v.x}}" cy="{{v.y}}" r="{{v.ring}}" fill="{{v.color}}" fill-opacity=".18"></circle>
                <g transform="translate({{v.x}} {{v.y}}) rotate({{v.hdg}})"><path d="M0 -24 17 20 0 10 -17 20Z" fill="{{v.color}}" stroke="{{v.outline}}" stroke-width="3" stroke-linejoin="round"></path></g>
                <rect x="{{v.lx}}" y="{{v.ly}}" width="{{v.lw}}" height="32" rx="2" fill="#0A0F14"></rect>
                <text x="{{v.tx}}" y="{{v.ty}}" fill="#E8EEF4" font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="600">{{v.name}}</text>
              </g>
            </sc-for>
          </svg>
        </div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;background:#111921;border-top:1px solid #25323E">
          <span style="font-weight:600">All vehicles</span>
          <button type="button" onClick="{{pauseAll}}" style="min-height:48px;padding:0 18px;border:1px solid #60728A;border-radius:4px;background:{{pauseBg}};color:{{pauseFg}};font:inherit;font-weight:600;cursor:pointer">{{pauseLabel}}</button>
          <button type="button" onClick="{{returnAll}}" style="min-height:48px;padding:0 18px;border:0;border-radius:4px;background:#FFB54A;color:#241600;font:inherit;font-weight:700;cursor:pointer">{{returnLabel}}</button>
          <a href="FlyFormation.dc.html" style="display:flex;align-items:center;min-height:48px;padding:0 18px;border:1px solid #60728A;border-radius:4px;color:#E8EEF4;font-weight:600;text-decoration:none">Formation</a>
          <span style="flex:1 1 200px;color:#A9B8C5">{{groupNote}}</span>
        </div>
      </section>
      <aside data-l="pane col" style="flex:1 1 360px;min-width:0;box-sizing:border-box;background:#111921;border-left:1px solid #25323E;padding:16px;display:flex;flex-direction:column;gap:8px">
        <h1 style="margin:2px 4px 8px;font-size:20px;font-weight:600">Fleet · 4 vehicles</h1>
        <sc-for list="{{vehicles}}" as="v" hint-placeholder-count="4">
          <button type="button" onClick="{{v.pick}}" style="display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid {{v.border}};border-radius:5px;background:{{v.bg}};color:#E8EEF4;font:inherit;text-align:left;cursor:pointer">
            <span style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><span style="font-weight:600;font-size:16px">{{v.name}}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600">{{v.mode}}</span></span>
            <span style="color:{{v.noteFg}};font-size:13px">{{v.note}}</span>
            <span style="display:flex;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#A9B8C5"><span>Battery {{v.batt}}%</span><span>Link {{v.link}}%</span><span>{{v.alt}} m</span></span>
          </button>
        </sc-for>
        <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
          <div style="font-weight:600">{{selName}}</div>
          <div style="display:flex;gap:8px">
            <a href="Fly.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid #60728A;border-radius:4px;color:#E8EEF4;font-weight:600;text-decoration:none">Open</a>
            <button type="button" style="flex:1;min-height:48px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-weight:600;cursor:pointer">Pause</button>
            <button type="button" style="flex:1;min-height:48px;border:1px solid #FFB54A;border-radius:4px;background:transparent;color:#FFB54A;font:inherit;font-weight:600;cursor:pointer">Return home</button>
          </div>
        </div>
      </aside>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { n:0, sel:'q1', confirm:null, sent:null };
  componentDidMount() { this.timer = setInterval(() => this.setState((s) => ({ n:s.n+1 })), 300); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const s = this.state;
    const P = {
      q1:(n) => { const f = (n%190)/190, t = f<.5?f*2:2-f*2; return [560+380*t, 352-40*t]; },
      q2:() => [360,300],
      p1:(n) => [900+120*Math.cos(n/18), 640+90*Math.sin(n/18)],
      q3:(n) => { const f = Math.min(1,n/260); return [640-380*f, 640+50*f]; },
    };
    const D = [
      { id:'q1', name:'Quad 1', mode:'AUTO', note:'Survey line 3 of 4', batt:87, link:98, alt:60 },
      { id:'q2', name:'Quad 2', mode:'LOITER', note:'Holding, waiting for you', batt:64, link:94, alt:40 },
      { id:'p1', name:'Plane 1', mode:'CIRCLE', note:'Circling at 80 m', batt:72, link:88, alt:80 },
      { id:'q3', name:'Quad 3', mode:'RTL', note:'⚠ Battery low, returning home', batt:21, link:91, alt:35, warn:true },
    ];
    const vehicles = D.map((v) => {
      const [x,y] = P[v.id](s.n), [x2,y2] = P[v.id](s.n+1);
      const moving = Math.hypot(x2-x,y2-y) > .01, on = s.sel===v.id, color = v.warn?'#FFB54A':'#56D9F2';
      const lw = 16+v.name.length*11;
      return { ...v, x:x.toFixed(0), y:y.toFixed(0), hdg:moving?((Math.atan2(x2-x,-(y2-y))*180/Math.PI+360)%360).toFixed(0):'0', color, outline:on?'#FFFFFF':color, ring:on?46:34,
        lx:(x+36).toFixed(0), ly:(y-16).toFixed(0), lw, tx:(x+44).toFixed(0), ty:(y+7).toFixed(0),
        border:on?'#56D9F2':v.warn?'#FFB54A':'#25323E', bg:on?'#123440':'transparent', noteFg:v.warn?'#FFB54A':'#A9B8C5', pick:() => this.setState({ sel:v.id }) };
    });
    const sel = D.find((v) => v.id===s.sel);
    const twoStep = (key,verb) => () => {
      if (s.confirm===key) this.setState({ confirm:null, sent:verb });
      else this.setState({ confirm:key, sent:null });
    };
    return {
      vehicles, selName:sel.name, selMode:sel.mode, selBatt:sel.batt+'%',
      aria:'Four vehicles on the map',
      pauseAll:twoStep('pause','Pause'), returnAll:twoStep('return','Return home'),
      pauseLabel:s.confirm==='pause'?'Confirm: pause 4':'Pause all',
      pauseBg:s.confirm==='pause'?'#123440':'transparent', pauseFg:s.confirm==='pause'?'#56D9F2':'#E8EEF4',
      returnLabel:s.confirm==='return'?'Confirm: return 4':'Return all home',
      groupNote:s.sent?'✓ '+s.sent+' confirmed by 4 of 4 vehicles.':s.confirm?'Press again to send to every vehicle.':'Commands here go to every vehicle at once.',
    };
  }
}
</script>
</body>
</html>
