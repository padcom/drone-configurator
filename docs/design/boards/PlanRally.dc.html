<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rally points</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A0F14}
a{color:#56D9F2}a:hover{color:#8FE7F7}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #56D9F2;outline-offset:2px}
</style>
<style data-shell>
[data-l~="measure"]>*{max-width:var(--measure)}
@media (min-width:1000px){
html:has([data-l~="app"]),body:has([data-l~="app"]){height:100%;overflow:hidden}
[data-l~="app"]{height:100vh;min-height:0!important;overflow:hidden}
[data-l~="row"]{flex-wrap:nowrap!important;min-height:0}
[data-l~="fill"]{flex:1 1 0!important;min-height:0}
[data-l~="clip"]{min-height:0;overflow:hidden}
[data-l~="pane"]{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#60728A transparent}
[data-l~="pane"][data-l~="col"]>*:not([data-l~="map"]){flex-shrink:0!important}
[data-l~="map"]{min-width:0;min-height:240px!important}
}
</style>
</helmet>
<div data-l="app" style="min-height:900px;display:flex;flex-direction:column;background:#0A0F14;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.4">
  <dc-import name="TopBar" status="disarmed" hint-size="100%,64px"></dc-import>
  <div data-l="row fill" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:stretch">
    <div data-l="pane" style="flex:1 1 76px;background:#111921;border-right:1px solid #25323E"><dc-import name="Rail" active="plan" hint-size="76px,640px"></dc-import></div>
    <main data-l="clip" style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
      <dc-import name="PlanBar" active="rally" hint-size="100%,66px"></dc-import>
      <div data-l="fill row" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:stretch">
        <section data-l="map" style="flex:999 1 520px;min-width:0;min-height:520px;position:relative;overflow:hidden">
          <dc-import name="MapBase" hint-size="100%,520px"></dc-import>
          <svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="{{aria}}" onClick="{{mapClick}}" style="position:absolute;inset:0;width:100%;height:100%;cursor:crosshair">
            <polyline points="250,700 360,570 560,456 940,416 940,364 560,404 560,352 940,312 940,260 560,300 430,380 250,700" fill="none" stroke="#EE82F5" stroke-width="3" stroke-opacity=".7" stroke-linejoin="round"></polyline>
            <line x1="{{wx1}}" y1="{{wy1}}" x2="{{wx2}}" y2="{{wy2}}" stroke="#FFB54A" stroke-width="3" stroke-dasharray="8 7"></line>
            <circle cx="250" cy="700" r="24" fill="#10171E" stroke="#62E3A6" stroke-width="4"></circle>
            <text x="250" y="710" text-anchor="middle" fill="#62E3A6" font-family="IBM Plex Mono, monospace" font-size="28" font-weight="600">H</text>
            <sc-for list="{{points}}" as="p" hint-placeholder-count="3">
              <g onClick="{{p.pick}}" style="cursor:pointer">
                <circle cx="{{p.x}}" cy="{{p.y}}" r="24" fill="{{p.fill}}" stroke="#62E3A6" stroke-width="3"></circle>
                <text x="{{p.x}}" y="{{p.ty}}" text-anchor="middle" fill="{{p.fg}}" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="600">{{p.label}}</text>
              </g>
            </sc-for>
          </svg>
          <div style="position:absolute;left:16px;top:16px;padding:10px 14px;background:#111921;border:1px solid #25323E;border-radius:4px;font-weight:500">Click the map to add a rally point</div>
        </section>
        <aside data-l="pane col" style="flex:1 1 340px;min-width:0;box-sizing:border-box;background:#111921;border-left:1px solid #25323E;padding:20px;display:flex;flex-direction:column;gap:12px">
          <div>
            <h1 style="margin:0;font-size:20px;font-weight:600">Rally points</h1>
            <p style="margin:4px 0 0;color:#A9B8C5">Safe places to return to. The vehicle goes to whichever is closest.</p>
          </div>
          <div style="padding:14px;border:1px solid #25323E;border-radius:5px">
            <div style="font-size:11px;font-weight:500;letter-spacing:.08em;color:#A9B8C5">FARTHEST FROM SAFETY</div>
            <div style="font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600">{{worst}} m</div>
            <div style="font-size:12.5px;color:#A9B8C5">Longest return on this mission</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <sc-for list="{{points}}" as="p" hint-placeholder-count="3">
              <div style="display:flex;align-items:center;gap:8px;min-height:52px;padding:0 8px 0 0;border:1px solid {{p.border}};border-radius:4px;background:{{p.bg}}">
                <button type="button" onClick="{{p.pick}}" style="flex:1;min-height:50px;padding:0 12px;border:0;background:transparent;color:#E8EEF4;font:inherit;font-weight:500;text-align:left;cursor:pointer">{{p.label}} · {{p.alt}} m</button>
                <button type="button" onClick="{{p.remove}}" style="min-height:40px;padding:0 10px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-size:13px;font-weight:500;cursor:pointer">Remove</button>
              </div>
            </sc-for>
          </div>
          <sc-if value="{{hasSel}}" hint-placeholder-val="{{true}}">
            <label style="display:flex;flex-direction:column;font-size:13px;color:#A9B8C5">
              <span style="display:flex;justify-content:space-between"><span>Altitude at {{selLabel}}</span><span style="font-family:'IBM Plex Mono',monospace;color:#E8EEF4;font-size:15px">{{selAlt}} m</span></span>
              <input type="range" min="15" max="120" step="5" value="{{selAlt}}" onChange="{{altChange}}" style="accent-color:#56D9F2;min-height:40px;margin:0">
            </label>
          </sc-if>
          <label style="display:flex;gap:12px;align-items:center;min-height:44px;cursor:pointer"><input type="checkbox" checked="{{useHome}}" onChange="{{homeChange}}" style="width:20px;height:20px;accent-color:#56D9F2;margin:0"><span>Home also counts as a safe place</span></label>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#A9B8C5;margin-top:auto">Writes rally points, RALLY_INCL_HOME</div>
        </aside>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { pts:[{ id:1,x:480,y:640,alt:40 },{ id:2,x:880,y:560,alt:40 },{ id:3,x:760,y:180,alt:50 }], next:4, sel:1, useHome:true };
  renderVals() {
    const s = this.state;
    const ROUTE = [[250,700],[360,570],[560,456],[940,416],[940,364],[560,404],[560,352],[940,312],[940,260],[560,300],[430,380]];
    const safe = s.pts.map((p) => [p.x,p.y]).concat(s.useHome ? [[250,700]] : []);
    let worst = -1, from = ROUTE[0], to = safe[0] ?? ROUTE[0];
    for (const r of ROUTE) {
      let best = Infinity, b = r;
      for (const q of safe) { const d = Math.hypot(r[0]-q[0], r[1]-q[1]); if (d < best) { best = d; b = q; } }
      if (best !== Infinity && best > worst) { worst = best; from = r; to = b; }
    }
    const remove = (id) => (e) => { e.stopPropagation(); this.setState({ pts:s.pts.filter((p) => p.id!==id), sel:s.sel===id?null:s.sel }); };
    const points = s.pts.map((p,i) => {
      const on = p.id===s.sel;
      return { ...p, label:'R'+(i+1), ty:p.y+7, fill:on?'#62E3A6':'#10171E', fg:on?'#06281A':'#62E3A6', border:on?'#56D9F2':'#60728A', bg:on?'#123440':'transparent',
        pick:(e) => { e.stopPropagation(); this.setState({ sel:p.id }); }, remove:remove(p.id) };
    });
    const sel = points.find((p) => p.id===s.sel);
    return {
      points, worst:worst<0?'—':Math.round(worst*.5),
      wx1:from[0], wy1:from[1], wx2:to[0], wy2:to[1],
      aria:points.length+' rally points on the map',
      mapClick:(e) => {
        const svg = e.currentTarget, pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        const p = pt.matrixTransform(svg.getScreenCTM().inverse());
        this.setState({ pts:s.pts.concat([{ id:s.next, x:Math.round(p.x), y:Math.round(p.y), alt:40 }]), next:s.next+1, sel:s.next });
      },
      hasSel:!!sel, selLabel:sel?sel.label:'', selAlt:sel?sel.alt:40,
      altChange:(e) => this.setState({ pts:s.pts.map((p) => (p.id===s.sel ? { ...p, alt:Number(e.target.value) } : p)) }),
      useHome:s.useHome, homeChange:(e) => this.setState({ useHome:e.target.checked }),
    };
  }
}
</script>
</body>
</html>
