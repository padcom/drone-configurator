<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fly: guided</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A0F14}
a{color:#56D9F2}a:hover{color:#8FE7F7}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #56D9F2;outline-offset:2px}
</style>
<style data-shell>
[data-l~="measure"]>*{max-width:var(--measure)}
@media (min-width:1000px){
html:has([data-l~="app"]),body:has([data-l~="app"]){height:100%;overflow:hidden}
[data-l~="app"]{height:100vh;min-height:0!important;overflow:hidden}
[data-l~="row"]{flex-wrap:nowrap!important;min-height:0}
[data-l~="fill"]{flex:1 1 0!important;min-height:0}
[data-l~="clip"]{min-height:0;overflow:hidden}
[data-l~="pane"]{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#60728A transparent}
[data-l~="pane"][data-l~="col"]>*:not([data-l~="map"]){flex-shrink:0!important}
[data-l~="map"]{min-width:0;min-height:240px!important}
}
</style>
</helmet>
<div data-l="app" style="min-height:900px;display:flex;flex-direction:column;background:#0A0F14;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.4">
  <dc-import name="TopBar" status="{{barStatus}}" mode="{{barMode}}" gps="{{barGps}}" hint-size="100%,64px"></dc-import>
  <div data-l="row fill" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:stretch">
    <div data-l="pane" style="flex:1 1 76px;background:#111921;border-right:1px solid #25323E"><dc-import name="Rail" active="fly" hint-size="76px,640px"></dc-import></div>
    <main data-l="row" style="flex:999 1 560px;min-width:0;display:flex;flex-wrap:wrap;align-items:stretch">
      <section data-l="clip" style="flex:999 1 520px;min-width:0;display:flex;flex-direction:column">
        <dc-import name="FlyNav" active="guided" hint-size="100%,56px"></dc-import>
        <div data-l="fill map" style="flex:1 1 560px;min-height:560px;position:relative;overflow:hidden">
          <dc-import name="MapBase" hint-size="100%,560px"></dc-import>
          <svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="{{aria}}" onClick="{{mapClick}}" style="position:absolute;inset:0;width:100%;height:100%;cursor:crosshair">
            <sc-if value="{{showHome}}" hint-placeholder-val="{{true}}">
              <circle cx="{{homeX}}" cy="{{homeY}}" r="24" fill="#10171E" stroke="#62E3A6" stroke-width="4"></circle>
              <text x="{{homeX}}" y="{{homeTy}}" text-anchor="middle" fill="#62E3A6" font-family="IBM Plex Mono, monospace" font-size="28" font-weight="600">H</text>
            </sc-if>
            <sc-if value="{{showOriginPin}}" hint-placeholder-val="{{false}}">
              <g transform="translate({{ox}} {{oy}})">
                <circle r="30" fill="#10171E" fill-opacity=".7" stroke="#E8EEF4" stroke-width="4" stroke-dasharray="{{originDash}}"></circle>
                <path d="M0 -46V-14M0 14V46M-46 0H-14M14 0H46" stroke="#E8EEF4" stroke-width="4" stroke-linecap="round"></path>
              </g>
              <rect x="{{olx}}" y="{{oly}}" width="96" height="36" rx="2" fill="#0A0F14"></rect>
              <text x="{{otx}}" y="{{oty}}" fill="#E8EEF4" font-size="22" font-weight="600" font-family="IBM Plex Sans, sans-serif">Origin</text>
            </sc-if>
            <sc-if value="{{hasGoal}}" hint-placeholder-val="{{false}}">
              <line x1="{{vx}}" y1="{{vy}}" x2="{{gx}}" y2="{{gy}}" stroke="#EE82F5" stroke-width="4" stroke-dasharray="{{dash}}"></line>
              <g transform="translate({{gx}} {{gy}}) rotate(45)"><rect x="-15" y="-15" width="30" height="30" fill="#10171E" stroke="#EE82F5" stroke-width="4"></rect></g>
            </sc-if>
            <sc-if value="{{hasRoi}}" hint-placeholder-val="{{false}}">
              <circle cx="{{rx}}" cy="{{ry}}" r="20" fill="none" stroke="#FFB54A" stroke-width="4"></circle>
              <circle cx="{{rx}}" cy="{{ry}}" r="4" fill="#FFB54A"></circle>
            </sc-if>
            <sc-if value="{{showVehicle}}" hint-placeholder-val="{{true}}">
              <g transform="translate({{vx}} {{vy}}) rotate({{hdg}})">
                <circle r="40" fill="#56D9F2" fill-opacity=".2"></circle>
                <path d="M0 -28 20 24 0 12 -20 24Z" fill="#56D9F2" stroke="#56D9F2" stroke-width="4" stroke-linejoin="round"></path>
              </g>
            </sc-if>
          </svg>
          <sc-if value="{{showPrompt}}" hint-placeholder-val="{{true}}"><div style="position:absolute;left:16px;top:16px;padding:10px 14px;background:#111921;border:1px solid #25323E;border-radius:4px;font-weight:500">{{prompt}}</div></sc-if>
        </div>
      </section>
      <aside data-l="pane col" style="flex:1 1 360px;min-width:0;box-sizing:border-box;background:#111921;border-left:1px solid #25323E;padding:20px;display:flex;flex-direction:column;gap:14px">
        <div>
          <h1 style="margin:0;font-size:20px;font-weight:600">{{title}}</h1>
          <p style="margin:4px 0 0;color:#A9B8C5">{{subtitle}}</p>
        </div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
          <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
            <div style="padding:10px 12px;border:1px solid #25323E;border-radius:5px">
              <div style="font-size:11px;font-weight:500;letter-spacing:.08em;color:#A9B8C5">{{t.label}}</div>
              <div style="font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600">{{t.value}}</div>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{showTyped}}" hint-placeholder-val="{{true}}">
          <div style="display:flex;gap:8px;align-items:flex-end">
            <label style="flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A9B8C5">Or type a position<input value="{{coord}}" onChange="{{coordChange}}" placeholder="47.3980, 8.5463" style="min-height:44px;box-sizing:border-box;padding:0 12px;border:1px solid {{coordBorder}};border-radius:4px;background:#0A0F14;color:#E8EEF4;font-family:'IBM Plex Mono',monospace;font-size:13px"></label>
            <button type="button" onClick="{{coordGo}}" style="min-height:44px;padding:0 14px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-weight:500;cursor:pointer">Show</button>
          </div>
          <sc-if value="{{hasCoordError}}" hint-placeholder-val="{{false}}"><p role="alert" style="margin:0;color:#FFB54A;font-size:13px">{{coordError}}</p></sc-if>
        </sc-if>
        <sc-if value="{{hasPending}}" hint-placeholder-val="{{false}}">
          <div style="padding:10px 12px;border:1px solid #25323E;border-radius:5px">
            <div style="font-size:11px;font-weight:500;letter-spacing:.08em;color:#A9B8C5">POSITION</div>
            <div style="font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600">{{posText}}</div>
          </div>
        </sc-if>
        <sc-if value="{{showOriginPending}}" hint-placeholder-val="{{false}}">
          <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A9B8C5">Ground height above sea level, in metres
            <input inputmode="decimal" value="{{originAlt}}" onChange="{{originAltChange}}" style="min-height:44px;box-sizing:border-box;padding:0 12px;border:1px solid {{originAltBorder}};border-radius:4px;background:#0A0F14;color:#E8EEF4;font-family:'IBM Plex Mono',monospace;font-size:15px">
          </label>
          <sc-if value="{{originRejected}}" hint-placeholder-val="{{false}}"><p role="alert" style="margin:0;padding:12px 14px;border-radius:4px;background:#3F1A1A;color:#FF7A70;font-weight:500">Quad 1 did not accept the origin. Nothing changed.</p></sc-if>
          <button type="button" disabled="{{originBlocked}}" onClick="{{originPress}}" style="min-height:52px;border:1px solid {{originBorder}};border-radius:4px;background:{{originBg}};color:{{originFg}};font:inherit;font-size:15px;font-weight:700;cursor:pointer">{{originLabel}}</button>
          <span style="color:#A9B8C5;font-size:13px">{{originNote}}</span>
          <button type="button" onClick="{{cancel}}" style="min-height:44px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-weight:500;cursor:pointer">Cancel</button>
        </sc-if>
        <sc-if value="{{originDone}}" hint-placeholder-val="{{false}}">
          <div role="status" style="padding:12px 14px;border-radius:4px;background:#123327;color:#62E3A6;font-weight:500">✓ Confirmed by Quad 1<br><span style="font-family:'IBM Plex Mono',monospace;font-size:13px">{{originRead}}</span></div>
          <a href="ArmGate.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:4px;background:#56D9F2;color:#06222B;font-size:15px;font-weight:700;text-decoration:none">Review and arm</a>
          <button type="button" onClick="{{originAgain}}" style="min-height:44px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-weight:500;cursor:pointer">Set the origin again</button>
        </sc-if>
        <sc-if value="{{showGuidedPending}}" hint-placeholder-val="{{false}}">
          <label style="display:flex;flex-direction:column;font-size:13px;color:#A9B8C5">
            <span style="display:flex;justify-content:space-between"><span>Altitude</span><span style="font-family:'IBM Plex Mono',monospace;color:#E8EEF4;font-size:15px">{{alt}} m</span></span>
            <input type="range" min="10" max="120" step="5" value="{{alt}}" onChange="{{altChange}}" style="accent-color:#56D9F2;min-height:40px;margin:0">
          </label>
          <label style="display:flex;flex-direction:column;font-size:13px;color:#A9B8C5">
            <span style="display:flex;justify-content:space-between"><span>Speed</span><span style="font-family:'IBM Plex Mono',monospace;color:#E8EEF4;font-size:15px">{{speedSet}} m/s</span></span>
            <input type="range" min="1" max="15" step="1" value="{{speedSet}}" onChange="{{speedChange}}" style="accent-color:#56D9F2;min-height:40px;margin:0">
          </label>
          <button type="button" onClick="{{go}}" style="min-height:52px;border:0;border-radius:4px;background:#56D9F2;color:#06222B;font:inherit;font-size:15px;font-weight:700;cursor:pointer">Go here</button>
          <div style="display:flex;gap:10px">
            <button type="button" onClick="{{look}}" style="flex:1;min-height:44px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-weight:500;cursor:pointer">Look at this point</button>
            <button type="button" onClick="{{setHome}}" style="flex:1;min-height:44px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-weight:500;cursor:pointer">Set home here</button>
            <button type="button" onClick="{{cancel}}" style="flex:1;min-height:44px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-weight:500;cursor:pointer">Cancel</button>
          </div>
        </sc-if>
        <sc-if value="{{showFlight}}" hint-placeholder-val="{{true}}">
          <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
            <a href="Fly.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid #60728A;border-radius:4px;color:#E8EEF4;font-weight:600;text-decoration:none">Resume the mission at item 9</a>
            <div style="display:flex;gap:10px">
              <button type="button" style="flex:1;min-height:48px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-weight:600;cursor:pointer">Land here</button>
              <button type="button" style="flex:1;min-height:48px;border:0;border-radius:4px;background:#FFB54A;color:#241600;font:inherit;font-weight:700;cursor:pointer">Return home</button>
            </div>
          </div>
        </sc-if>
      </aside>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"gps":{"editor":"enum","options":["ok","none"],"default":"ok"},"originResult":{"editor":"enum","options":["accepted","rejected"],"default":"accepted"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { x:700, y:400, hdg:90, target:null, pending:null, roi:null, alt:60, speed:8, home:[250,700], origin:null, originAlt:'468', originStep:0, originPhase:null, coord:'', coordError:'' };
  componentDidMount() {
    this.timer = setInterval(() => this.setState((s) => {
      if (!s.target) return null;
      const dx = s.target[0]-s.x, dy = s.target[1]-s.y, d = Math.hypot(dx,dy), step = 5;
      if (d <= step) return { x:s.target[0], y:s.target[1], target:null };
      return { x:s.x+dx/d*step, y:s.y+dy/d*step, hdg:(Math.atan2(dx,-dy)*180/Math.PI+360)%360 };
    }), 200);
  }
  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.reply); }
  renderVals() {
    const s = this.state;
    const noGps = this.props.gps === 'none', needOrigin = noGps && !s.origin, originDone = noGps && !!s.origin, sending = s.originPhase === 'sending';
    const LAT = 47.398, LON = 8.5463, MLAT = 111320, MLON = 111320*Math.cos(LAT*Math.PI/180);
    const toLL = ([x,y]) => [LAT+(700-y)*.5/MLAT, LON+(x-250)*.5/MLON];
    const fromLL = (la,lo) => [250+(lo-LON)*MLON/.5, 700-(la-LAT)*MLAT/.5];
    const fmt = (p,d=6) => { const [la,lo] = toLL(p); return la.toFixed(d)+', '+lo.toFixed(d); };
    const altNum = Number(s.originAlt), altBad = s.originAlt.trim()==='' || Number.isNaN(altNum) || altNum < -500 || altNum > 9000;
    const goal = s.pending ?? s.target;
    const distU = goal ? Math.hypot(goal[0]-s.x, goal[1]-s.y) : 0;
    const dM = Math.round(distU*.5);
    const brg = goal ? Math.round((Math.atan2(goal[0]-s.x, -(goal[1]-s.y))*180/Math.PI+360)%360) : 0;
    const moving = !!s.target;
    return {
      vx:s.x.toFixed(0), vy:s.y.toFixed(0), hdg:s.hdg.toFixed(0),
      hasGoal:!!goal && !noGps, gx:goal?goal[0]:0, gy:goal?goal[1]:0, dash:s.pending?'10 9':'none',
      hasRoi:!!s.roi, rx:s.roi?s.roi[0]:0, ry:s.roi?s.roi[1]:0,
      hasPending:!!s.pending, alt:s.alt, posText:s.pending?fmt(s.pending):'',
      barStatus:noGps?'disarmed':'armed', barMode:noGps?'STABILIZE':'GUIDED', barGps:noGps?'NONE':undefined,
      showHome:!noGps, showVehicle:!needOrigin, showTyped:!originDone, showFlight:!noGps,
      showPrompt:!originDone, prompt:needOrigin?'Click where the vehicle is right now':'Click the map to choose where to go',
      showGuidedPending:!!s.pending && !noGps, showOriginPending:!!s.pending && needOrigin, originDone,
      showOriginPin:noGps && !!(s.pending ?? s.origin), originDash:s.pending?'8 8':'none',
      ox:(s.pending ?? s.origin ?? [0,0])[0], oy:(s.pending ?? s.origin ?? [0,0])[1], olx:(s.pending ?? s.origin ?? [0,0])[0]+42, oly:(s.pending ?? s.origin ?? [0,0])[1]-18, otx:(s.pending ?? s.origin ?? [0,0])[0]+52, oty:(s.pending ?? s.origin ?? [0,0])[1]+8,
      originAlt:s.originAlt, originAltBorder:altBad?'#FFB54A':'#60728A',
      originAltChange:(e) => this.setState({ originAlt:e.target.value, originStep:0, originPhase:null }),
      originRejected:s.originPhase==='rejected', originBlocked:altBad || sending,
      originLabel:sending?'Waiting for Quad 1':s.originStep===1?'Confirm: '+fmt(s.pending ?? [0,0],5):'Set the origin here',
      originBg:sending?'#25323E':s.originStep===1?'#123440':'#56D9F2', originFg:sending?'#A9B8C5':s.originStep===1?'#56D9F2':'#06222B', originBorder:s.originStep===1?'#56D9F2':'transparent',
      originNote:sending?'Sent. Waiting for the vehicle to report its origin back.':s.originStep===1?'Press again to send this position to Quad 1.':altBad?'Enter a height between -500 and 9000 m.':'Moving the point or changing the height starts this over.',
      originPress:() => {
        if (s.originStep===0) return this.setState({ originStep:1, originPhase:null });
        const p = s.pending; this.setState({ originPhase:'sending' });
        this.reply = setTimeout(() => this.setState(this.props.originResult==='rejected' ? { originPhase:'rejected', originStep:0 } : { origin:p, x:p[0], y:p[1], pending:null, originPhase:null, originStep:0 }), 1200);
      },
      originRead:s.origin?fmt(s.origin)+' · '+altNum+' m':'',
      originAgain:() => this.setState({ origin:null, pending:null, originStep:0, originPhase:null }),
      aria:needOrigin?'Map. Choose where the vehicle is right now':moving?'Vehicle flying to the chosen point':'Vehicle holding position',
      title:originDone?'Origin set':needOrigin?(s.pending?'Is the vehicle here?':'Set the EKF origin'):s.pending?'Fly to this point?':moving?'Flying to the point':'Holding position',
      subtitle:originDone?'Quad 1 now knows where it is. Without GPS its position drifts over time, so check it before you fly.':needOrigin?(s.pending?'Nothing is sent until you confirm.':'Quad 1 has no GPS, so it can\'t tell where it is on the map. Show it where it is now.'):s.pending?'Nothing is sent until you confirm.':moving?dM+' m to go, about '+Math.round(dM/8)+' s.':'Waiting for your next command.',
      tiles:noGps?[{ label:'GPS', value:'None' },{ label:'ORIGIN', value:originDone?'Set':s.pending?'Not sent':'Not set' }]:[
        { label:'DISTANCE', value:goal?dM+' m':'—' },
        { label:'BEARING', value:goal?String(brg).padStart(3,'0')+'°':'—' },
        { label:'ALTITUDE', value:s.alt+' m' },
        { label:'SPEED', value:moving?s.speed.toFixed(1)+' m/s':'0.0 m/s' },
      ],
      mapClick:(e) => {
        if (originDone || sending) return;
        const svg = e.currentTarget, pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        const p = pt.matrixTransform(svg.getScreenCTM().inverse());
        this.setState({ pending:[Math.round(p.x),Math.round(p.y)], originStep:0, originPhase:null });
      },
      altChange:(e) => this.setState({ alt:Number(e.target.value) }),
      coord:s.coord, coordChange:(e) => this.setState({ coord:e.target.value, coordError:'' }), hasCoordError:!!s.coordError, coordError:s.coordError, coordBorder:s.coordError?'#FFB54A':'#60728A',
      coordGo:() => {
        if (sending) return;
        const m = s.coord.match(/^\s*(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)\s*$/);
        if (!m) return this.setState({ coordError:'Enter latitude and longitude, like 47.3980, 8.5463.' });
        const la = Number(m[1]), lo = Number(m[2]);
        if (Math.abs(la) > 90 || Math.abs(lo) > 180) return this.setState({ coordError:'Latitude goes up to 90 and longitude up to 180.' });
        const [x,y] = fromLL(la,lo);
        if (x < 0 || x > 1200 || y < 0 || y > 900) return this.setState({ coordError:'That is '+(Math.hypot(x-600,y-450)*.5/1000).toFixed(1)+' km from this map. Check the numbers.' });
        this.setState({ pending:[x,y], originStep:0, originPhase:null, coordError:'' });
      },
      speedSet:s.speed, speedChange:(e) => this.setState({ speed:Number(e.target.value) }),
      homeX:s.home[0], homeY:s.home[1], homeTy:s.home[1]+10,
      setHome:() => this.setState({ home:s.pending, pending:null }),
      go:() => this.setState({ target:s.pending, pending:null }),
      look:() => this.setState({ roi:s.pending, pending:null }),
      cancel:() => { clearTimeout(this.reply); this.setState({ pending:null, originStep:0, originPhase:null }); },
    };
  }
}
</script>
</body>
</html>
