<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A0F14}
a{color:#56D9F2}a:hover{color:#8FE7F7}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #56D9F2;outline-offset:2px}
</style>
<style data-shell>[data-l~="dlg"]>*{flex-shrink:0}</style>
</helmet>
<div data-l="dlg" style="overflow-y:auto;width:560px;height:680px;box-sizing:border-box;padding:28px;display:flex;flex-direction:column;gap:14px;background:#111921;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.4">
  <div>
    <h1 style="margin:0;font-size:24px;font-weight:600">{{title}}</h1>
    <p style="margin:4px 0 0;color:#A9B8C5">Quad 1 · North field survey · 3 min 40 s</p>
  </div>
  <sc-for list="{{open}}" as="o" hint-placeholder-count="2">
    <div style="display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 8px 6px 14px;box-sizing:border-box;border-radius:4px;background:{{o.bg}}">
      <span aria-hidden="true" style="color:{{o.color}};font-weight:700">{{o.glyph}}</span>
      <span style="flex:1;font-weight:500">{{o.name}}</span>
      <button type="button" disabled="{{o.done}}" onClick="{{o.fix}}" style="min-height:44px;padding:0 12px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-weight:500;cursor:pointer">{{o.action}}</button>
    </div>
  </sc-for>
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px"><h2 style="margin:0;font-size:12px;font-weight:600;letter-spacing:.09em;color:#A9B8C5">YOUR CHECKS</h2><a href="FlyChecklist.dc.html" style="font-size:13px">Edit the list</a></div>
  <sc-for list="{{manual}}" as="m" hint-placeholder-count="4">
    <label style="display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer">
      <input type="checkbox" checked="{{m.on}}" onChange="{{m.toggle}}" style="width:20px;height:20px;accent-color:#56D9F2;margin:0">
      <span>{{m.label}}</span>
    </label>
  </sc-for>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <label style="display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;font-weight:500"><input type="checkbox" checked="{{takeoff}}" onChange="{{takeoffChange}}" style="width:20px;height:20px;accent-color:#56D9F2;margin:0"><span>Take off to 30 m straight after arming</span></label>
    <sc-if value="{{notArmed}}" hint-placeholder-val="{{true}}">
      <button type="button" disabled="{{blocked}}" onPointerDown="{{start}}" onPointerUp="{{stop}}" onPointerLeave="{{stop}}" onKeyDown="{{keyDown}}" onKeyUp="{{stop}}" style="position:relative;overflow:hidden;min-height:64px;border:0;border-radius:5px;background:{{holdBg}};color:{{holdFg}};font:inherit;font-size:17px;font-weight:700;cursor:pointer;touch-action:none">
        <span aria-hidden="true" style="position:absolute;left:0;top:0;bottom:0;width:{{fill}};background:#FFD08A"></span>
        <span style="position:relative">{{holdLabel}}</span>
      </button>
    </sc-if>
    <sc-if value="{{armed}}" hint-placeholder-val="{{false}}">
      <a href="Fly.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:64px;border-radius:5px;background:#FFB54A;color:#241600;font-size:17px;font-weight:700;text-decoration:none">{{armedText}}</a>
    </sc-if>
    <a href="Main.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:44px;color:#E8EEF4;font-weight:500;text-decoration:none">Not now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":680}}'>
class Component extends DCLogic {
  state = { fixed:{}, ticks:{}, hold:0, armed:false };
  componentWillUnmount() { clearInterval(this.timer); }
  begin() {
    clearInterval(this.timer);
    this.timer = setInterval(() => this.setState((s) => {
      const hold = s.hold + 4;
      if (hold >= 100) { clearInterval(this.timer); return { hold:100, armed:true }; }
      return { hold };
    }), 50);
  }
  end() { clearInterval(this.timer); this.setState((s) => (s.armed ? null : { hold:0 })); }
  renderVals() {
    const s = this.state;
    const opens = [['compass','Compass 2 calibration'],['mission','Mission on the vehicle']];
    const open = opens.map(([id,name]) => {
      const done = !!s.fixed[id];
      return { name, done, glyph:done?'✓':'!', color:done?'#62E3A6':'#FFB54A', bg:done?'transparent':'#3A2A10', action:done?'Resolved':'Resolve', fix:() => this.setState({ fixed:{ ...s.fixed, [id]:true } }) };
    });
    const labels = ['Propellers are tight and undamaged','The battery is secured','The take-off area is clear','I can see the whole flight area'];
    const manual = labels.map((label,i) => ({ label, on:!!s.ticks[i], toggle:() => this.setState({ ticks:{ ...s.ticks, [i]:!s.ticks[i] } }) }));
    const remaining = open.filter((o) => !o.done).length + manual.filter((m) => !m.on).length;
    const blocked = remaining > 0;
    return {
      open, manual, blocked, armed:s.armed, notArmed:!s.armed,
      takeoff:!!s.takeoff, takeoffChange:(e) => this.setState({ takeoff:e.target.checked }),
      armedText:s.takeoff?'Armed, taking off. Go to Fly':'Armed. Go to Fly',
      title: blocked ? remaining + ' left before arming' : 'Ready to arm',
      holdBg: blocked ? '#25323E' : '#FFB54A',
      holdFg: blocked ? '#A9B8C5' : '#241600',
      holdLabel: blocked ? 'Finish the checks to arm' : 'Hold to arm',
      fill: s.hold + '%',
      start:() => this.begin(),
      stop:() => this.end(),
      keyDown:(e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); this.begin(); } },
    };
  }
}
</script>
</body>
</html>
