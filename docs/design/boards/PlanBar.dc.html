<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan tool bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:#111921;border-bottom:1px solid #25323E;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.4">
  <div style="display:flex;flex-direction:column;margin-right:10px">
    <span style="font-size:17px;font-weight:600">North field survey</span>
    <span style="font-size:12.5px;color:#A9B8C5">Saved here · changes not on the vehicle</span>
  </div>
  <nav aria-label="Plan tools" style="display:flex;border:1px solid #60728A;border-radius:4px;overflow:hidden">
    <sc-for list="{{tools}}" as="b" hint-placeholder-count="4">
      <a href="{{b.href}}" style="display:flex;align-items:center;min-height:44px;padding:0 14px;background:{{b.bg}};color:{{b.fg}};font-weight:500;text-decoration:none">{{b.label}}</a>
    </sc-for>
  </nav>
  <div style="flex:1 1 auto"></div>
  <button type="button" style="min-height:44px;padding:0 14px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-weight:500;cursor:pointer">Open</button>
  <button type="button" style="min-height:44px;padding:0 14px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-weight:500;cursor:pointer">Save</button>
  <button type="button" style="min-height:44px;padding:0 14px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-weight:500;cursor:pointer">Undo</button>
  <button type="button" style="min-height:44px;padding:0 14px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-weight:500;cursor:pointer">Read from vehicle</button>
  <a href="PlanWrite.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 18px;border-radius:4px;background:#56D9F2;color:#06222B;font-weight:600;text-decoration:none">Write to vehicle</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["mission","corridor","fence","rally"],"default":"mission"},"$preview":{"width":1120,"height":66}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'mission';
    return {
      tools:[['mission','Mission','Plan.dc.html'],['table','Table','PlanTable.dc.html'],['corridor','Corridor','PlanCorridor.dc.html'],['fence','Fence','PlanFence.dc.html'],['rally','Rally','PlanRally.dc.html'],['landing','Landing','PlanLanding.dc.html'],['transform','Transform','PlanTransform.dc.html'],['3d','3D','Plan3D.dc.html'],['generate','Generate','PlanGenerators.dc.html'],['layers','Layers','PlanLayers.dc.html']].map(([id,label,href]) => ({ label, href, bg:id===active?'#56D9F2':'transparent', fg:id===active?'#06222B':'#E8EEF4' })),
    };
  }
}
</script>
</body>
</html>
