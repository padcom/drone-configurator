<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fly: formation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A0F14}
a{color:#56D9F2}a:hover{color:#8FE7F7}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #56D9F2;outline-offset:2px}
</style>
<style data-shell>
[data-l~="measure"]>*{max-width:var(--measure)}
@media (min-width:1000px){
html:has([data-l~="app"]),body:has([data-l~="app"]){height:100%;overflow:hidden}
[data-l~="app"]{height:100vh;min-height:0!important;overflow:hidden}
[data-l~="row"]{flex-wrap:nowrap!important;min-height:0}
[data-l~="fill"]{flex:1 1 0!important;min-height:0}
[data-l~="clip"]{min-height:0;overflow:hidden}
[data-l~="pane"]{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#60728A transparent}
[data-l~="pane"][data-l~="col"]>*:not([data-l~="map"]){flex-shrink:0!important}
[data-l~="map"]{min-width:0;min-height:240px!important}
}
</style>
</helmet>
<div data-l="app" style="min-height:900px;display:flex;flex-direction:column;background:#0A0F14;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.4">
  <dc-import name="TopBar" status="armed" mode="GUIDED" hint-size="100%,64px"></dc-import>
  <div data-l="row fill" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:stretch">
    <div data-l="pane" style="flex:1 1 76px;background:#111921;border-right:1px solid #25323E"><dc-import name="Rail" active="fly" hint-size="76px,640px"></dc-import></div>
    <main data-l="row" style="flex:999 1 560px;min-width:0;display:flex;flex-wrap:wrap;align-items:stretch">
      <section data-l="clip" style="flex:999 1 520px;min-width:0;display:flex;flex-direction:column">
        <dc-import name="FlyNav" active="fleet" hint-size="100%,56px"></dc-import>
        <div data-l="fill map" style="flex:1 1 620px;min-height:520px;position:relative;overflow:hidden">
          <dc-import name="MapBase" hint-size="100%,620px"></dc-import>
          <svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="{{aria}}" style="position:absolute;inset:0;width:100%;height:100%">
            <sc-for list="{{slots}}" as="v" hint-placeholder-count="4">
              <line x1="600" y1="360" x2="{{v.x}}" y2="{{v.y}}" stroke="#E8EEF4" stroke-opacity=".3" stroke-dasharray="4 6"></line>
              <g transform="translate({{v.x}} {{v.y}})"><path d="M0 -24 17 20 0 10 -17 20Z" fill="{{v.color}}"></path></g>
              <rect x="{{v.lx}}" y="{{v.ly}}" width="96" height="30" rx="2" fill="#0A0F14"></rect>
              <text x="{{v.tx}}" y="{{v.ty}}" fill="#E8EEF4" font-size="18" font-weight="600" font-family="IBM Plex Sans, sans-serif">{{v.name}}</text>
            </sc-for>
          </svg>
        </div>
      </section>
      <aside data-l="pane col" style="flex:1 1 340px;min-width:0;box-sizing:border-box;background:#111921;border-left:1px solid #25323E;padding:20px;display:flex;flex-direction:column;gap:12px">
        <div><h1 style="margin:0;font-size:20px;font-weight:600">Formation</h1><p style="margin:4px 0 0;color:#A9B8C5">The others hold their place around the leader.</p></div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
          <sc-for list="{{shapes}}" as="c" hint-placeholder-count="4"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height:52px;border:1px solid {{c.border}};border-radius:5px;background:{{c.bg}};color:#E8EEF4;font:inherit;font-weight:600;cursor:pointer">{{c.label}}</button></sc-for>
        </div>
        <label style="display:flex;flex-direction:column;font-size:13px;color:#A9B8C5"><span style="display:flex;justify-content:space-between"><span>Spacing</span><span style="font-family:'IBM Plex Mono',monospace;color:#E8EEF4;font-size:15px">{{spacing}} m</span></span><input type="range" min="5" max="60" step="1" value="{{spacing}}" onChange="{{spacingChange}}" style="accent-color:#56D9F2;min-height:40px;margin:0"></label>
        <sc-if value="{{tight}}" hint-placeholder-val="{{false}}"><p role="alert" style="margin:0;padding:12px 14px;border-radius:4px;background:#3A2A10;color:#FFB54A;font-weight:500">Under 10 m leaves little margin for GPS error.</p></sc-if>
        <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
          <button type="button" onClick="{{start}}" style="min-height:52px;border:0;border-radius:4px;background:{{startBg}};color:{{startFg}};font:inherit;font-size:15px;font-weight:700;cursor:pointer">{{startLabel}}</button>
          <span style="color:#A9B8C5;font-size:13px">{{note}}</span>
          <a href="FlyFleet.dc.html">Back to the fleet</a>
        </div>
      </aside>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { shape:'V', spacing:25, step:0 };
  renderVals() {
    const s = this.state, u = s.spacing*2;
    const OFF = { Line:[[0,0],[-1,0],[1,0],[2,0]], V:[[0,0],[-1,1],[1,1],[-2,2]], Column:[[0,0],[0,1],[0,2],[0,3]], Box:[[0,0],[1,0],[0,1],[1,1]], 'Follow path':[[0,0],[-1,1],[-1,2],[0,3]] };
    const names = ['Quad 1','Quad 2','Plane 1','Quad 3'];
    const slots = OFF[s.shape].map(([dx,dy],i) => { const x = 600+dx*u, y = 360+dy*u; return { name:names[i], x, y, color:i===0?'#FFFFFF':'#56D9F2', lx:x+28, ly:y-15, tx:x+36, ty:y+7 }; });
    const flying = s.step===2, arm = s.step===1;
    return {
      slots, spacing:s.spacing, tight:s.spacing<10,
      aria:s.shape+' formation of four, '+s.spacing+' metres apart',
      shapes:Object.keys(OFF).map((label) => ({ label, on:s.shape===label, pick:() => this.setState({ shape:label, step:0 }), border:s.shape===label?'#56D9F2':'#60728A', bg:s.shape===label?'#123440':'transparent' })),
      spacingChange:(e) => this.setState({ spacing:Number(e.target.value), step:0 }),
      start:() => this.setState({ step:s.step>=2?0:s.step+1 }),
      startBg:flying?'#FFB54A':arm?'#123440':'#56D9F2', startFg:flying?'#241600':arm?'#56D9F2':'#06222B',
      startLabel:flying?'Stop formation':arm?'Confirm: 4 vehicles':'Start formation',
      note:flying?'✓ Holding formation. Quad 1 leads.':arm?'Press again. Every vehicle moves to its place.':'Quad 1 leads. Each vehicle climbs to its own height first.',
    };
  }
}
</script>
</body>
</html>
