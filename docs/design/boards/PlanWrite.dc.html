<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Write to vehicle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A0F14}
a{color:#56D9F2}a:hover{color:#8FE7F7}
a:focus-visible,button:focus-visible{outline:2px solid #56D9F2;outline-offset:2px}
</style>
<style data-shell>[data-l~="dlg"]>*{flex-shrink:0}</style>
</helmet>
<div data-l="dlg" style="overflow-y:auto;width:560px;height:680px;box-sizing:border-box;padding:28px;display:flex;flex-direction:column;gap:16px;background:#111921;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.4">
  <div>
    <h1 style="margin:0;font-size:24px;font-weight:600">{{title}}</h1>
    <p style="margin:4px 0 0;color:#A9B8C5">North field survey → Quad 1</p>
  </div>
  <div style="display:flex;flex-direction:column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid #25323E">
        <span style="flex:1;font-weight:500">{{r.name}}</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#A9B8C5">{{r.from}}</span>
        <span aria-hidden="true" style="color:#A9B8C5">→</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;width:80px;color:{{r.fg}}">{{r.to}}</span>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="2">
      <div>
        <div style="display:flex;justify-content:space-between;font-weight:500"><span>{{b.label}}</span><span style="font-family:'IBM Plex Mono',monospace">{{b.count}}</span></div>
        <div style="height:8px;border-radius:2px;background:#25323E;margin-top:6px"><div style="height:8px;border-radius:2px;background:{{b.color}};width:{{b.width}}"></div></div>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{failed}}" hint-placeholder-val="{{false}}">
    <div role="alert" style="padding:14px 16px;border-radius:4px;background:#3F1A1A;color:#FF7A70">
      <div style="font-weight:600">✕ Item 9: the vehicle reports 58 m, not 60 m.</div>
      <div style="color:#E8EEF4;margin-top:2px">Stopped there: the rest weren't checked. Do not fly this mission.</div>
    </div>
  </sc-if>
  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <div role="status" style="padding:14px 16px;border-radius:4px;background:#123327;color:#62E3A6;font-weight:600">✓ All 19 items written and read back.</div>
  </sc-if>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
    <sc-if value="{{idle}}" hint-placeholder-val="{{true}}">
      <button type="button" onClick="{{start}}" style="min-height:52px;border:0;border-radius:4px;background:#56D9F2;color:#06222B;font:inherit;font-size:15px;font-weight:600;cursor:pointer">Write and verify</button>
    </sc-if>
    <sc-if value="{{failed}}" hint-placeholder-val="{{false}}">
      <button type="button" onClick="{{start}}" style="min-height:52px;border:0;border-radius:4px;background:#56D9F2;color:#06222B;font:inherit;font-size:15px;font-weight:600;cursor:pointer">Try again</button>
    </sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <a href="ArmGate.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:4px;background:#56D9F2;color:#06222B;font-size:15px;font-weight:600;text-decoration:none">Review and arm</a>
    </sc-if>
    <a href="Plan.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:44px;color:#E8EEF4;font-weight:500;text-decoration:none">Back to Plan</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"failure":{"editor":"boolean","default":false},"$preview":{"width":560,"height":680}}'>
class Component extends DCLogic {
  state = { n:null };
  componentWillUnmount() { clearInterval(this.timer); }
  start() {
    clearInterval(this.timer);
    const failAt = this.props.failure ? 19+9 : 38;
    this.setState({ n:0 });
    this.timer = setInterval(() => this.setState((s) => {
      const n = s.n + 1;
      if (n >= failAt) clearInterval(this.timer);
      return { n:Math.min(n,failAt) };
    }), 70);
  }
  renderVals() {
    const T = 19, n = this.state.n;
    const fail = !!this.props.failure;
    const idle = n == null, wrote = idle ? 0 : Math.min(n,T), read = idle ? 0 : Math.max(0,n-T);
    const failed = fail && read >= 9, done = !fail && n === 38, busy = !idle && !failed && !done;
    return {
      idle, failed, done,
      title:failed?'Write failed':done?'On the vehicle':busy?'Writing':'Write to vehicle',
      rows:[
        { name:'Mission', from:'9 items', to:'14 items', fg:'#56D9F2' },
        { name:'Geofence', from:'2 zones', to:'2 zones', fg:'#A9B8C5' },
        { name:'Rally points', from:'none', to:'3 points', fg:'#56D9F2' },
      ],
      bars:[
        { label:'Written', count:wrote+' of '+T, width:(wrote/T*100)+'%', color:'#56D9F2' },
        { label:'Read back and checked', count:read+' of '+T, width:(read/T*100)+'%', color:failed?'#FF7A70':'#56D9F2' },
      ],
      start:() => this.start(),
    };
  }
}
</script>
</body>
</html>
