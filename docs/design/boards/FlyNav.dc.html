<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fly views</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Fly views" style="display:flex;flex-wrap:wrap;gap:2px;padding:5px 8px;background:{{t.panel}};border-bottom:1px solid {{t.line}};font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px">
  <sc-for list="{{tabs}}" as="b" hint-placeholder-count="5">
    <a href="{{b.href}}" style="display:flex;align-items:center;min-height:44px;padding:0 14px;border-radius:4px;background:{{b.bg}};color:{{b.fg}};font-weight:500;text-decoration:none">{{b.label}}</a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["mission","guided","fleet","camera","data"],"default":"mission"},"$preview":{"width":640,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'mission';
    const t = { panel:'#111921', line:'#25323E', text:'#E8EEF4', accent:'#56D9F2', accentBg:'#123440' };
    return {
      t,
      tabs:[['mission','Mission','Fly.dc.html'],['guided','Guided','FlyGuided.dc.html'],['fleet','Fleet','FlyFleet.dc.html'],['camera','Camera','FlyCamera.dc.html'],['traffic','Traffic','FlyTraffic.dc.html'],['outputs','Outputs','FlyOutputs.dc.html'],['sensors','Sensors','FlySensors.dc.html'],['data','Data','FlyData.dc.html']].map(([id,label,href]) => ({ label, href, bg:id===active?t.accentBg:'transparent', fg:id===active?t.accent:t.text })),
    };
  }
}
</script>
</body>
</html>
