<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enum field</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position:relative;width:100%;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.3;color:#E8EEF4">
  <input role="combobox" aria-expanded="{{open}}" aria-label="{{fieldLabel}}" autocomplete="off" value="{{text}}" onFocus="{{focus}}" onClick="{{click}}" onChange="{{type}}" onKeyDown="{{key}}" onBlur="{{blur}}" style="width:100%;box-sizing:border-box;min-height:44px;padding:0 {{padRight}} 0 12px;border:1px solid {{border}};border-radius:4px;background:#0A0F14;color:#E8EEF4;font:inherit;font-weight:500">
  <span style="position:absolute;right:34px;top:50%;transform:translateY(-50%);font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#A9B8C5;pointer-events:none">{{badge}}</span>
  <svg width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="#A9B8C5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position:absolute;right:13px;top:50%;margin-top:-4px;pointer-events:none"><path d="M1 1.5 6 6.5 11 1.5"></path></svg>
  <sc-if value="{{open}}" hint-placeholder-val="{{false}}">
    <div role="listbox" style="position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:30;max-height:260px;overflow-y:auto;padding:4px;background:#18222C;border:1px solid #60728A;border-radius:4px">
      <sc-if value="{{showCustom}}" hint-placeholder-val="{{false}}">
        <button type="button" tabindex="-1" onMouseDown="{{hold}}" onClick="{{useTyped}}" style="display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 8px;border:0;border-radius:2px;background:#123440;color:#E8EEF4;font:inherit;text-align:left;cursor:pointer"><span style="font-family:'IBM Plex Mono',monospace;font-size:13px;min-width:36px">{{typed}}</span><span style="color:#A9B8C5">Use this number, it has no name</span></button>
      </sc-if>
      <sc-for list="{{rows}}" as="o" hint-placeholder-count="4">
        <button type="button" role="option" aria-selected="{{o.selected}}" tabindex="-1" onMouseDown="{{hold}}" onClick="{{o.pick}}" style="display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 8px;border:0;border-radius:2px;background:{{o.bg}};color:#E8EEF4;font:inherit;text-align:left;cursor:pointer"><span style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#A9B8C5;min-width:36px">{{o.value}}</span><span style="flex:1">{{o.label}}</span><span aria-hidden="true" style="color:#56D9F2;font-weight:700">{{o.mark}}</span></button>
      </sc-for>
      <sc-if value="{{noMatch}}" hint-placeholder-val="{{false}}"><div style="padding:10px 8px;color:#A9B8C5">No match. Type a number to use it.</div></sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"value":{"editor":"int","default":1},"options":{"editor":null},"onPick":{"editor":null},"fieldLabel":{"editor":"text","default":"Value"},"$preview":{"width":320,"height":320}}'>
class Component extends DCLogic {
  state = { open:false, q:null, active:-1, own:null };
  renderVals() {
    const S = this.state;
    const opts = this.props.options ?? [{ value:0, label:'Report only' },{ value:1, label:'Return or land' },{ value:2, label:'Always land' }];
    const v = Number(this.props.value ?? S.own ?? 1);
    const cur = opts.find((o) => o.value === v);
    const qt = (S.q ?? '').trim().toLowerCase();
    const num = /^-?\d+(\.\d+)?$/.test(qt);
    const list = opts.filter((o) => !qt || o.label.toLowerCase().includes(qt) || String(o.value).startsWith(qt));
    const exact = num && opts.some((o) => o.value === Number(qt));
    const pick = (n) => {
      this.setState({ open:false, q:null, active:-1, own:n });
      if (this.props.onPick) this.props.onPick(n);
    };
    const close = () => this.setState({ open:false, q:null, active:-1 });
    return {
      open:S.open, fieldLabel:this.props.fieldLabel ?? 'Value',
      text:S.q ?? (cur ? cur.label : String(v)),
      badge:S.q != null ? '' : (cur ? v : 'no name'),
      padRight:S.q != null ? '34px' : (cur ? '72px' : '96px'),
      border:S.open ? '#56D9F2' : '#60728A',
      rows:list.map((o,i) => ({ ...o, selected:o.value===v, mark:o.value===v?'✓':'', bg:i===S.active?'#123440':'transparent', pick:() => pick(o.value) })),
      noMatch:list.length===0 && !num,
      showCustom:num && !exact, typed:qt, useTyped:() => pick(Number(qt)),
      hold:(e) => e.preventDefault(),
      focus:(e) => { e.target.select(); this.setState({ open:true }); },
      click:() => this.setState({ open:true }),
      type:(e) => this.setState({ q:e.target.value, open:true, active:-1 }),
      blur:() => { if (num) pick(Number(qt)); else close(); },
      key:(e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ open:true, active:Math.min(list.length-1, S.active+1) }); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ active:Math.max(0, S.active-1) }); }
        else if (e.key === 'Escape') { close(); }
        else if (e.key === 'Enter') {
          e.preventDefault();
          if (S.active >= 0 && list[S.active]) pick(list[S.active].value);
          else if (num) pick(Number(qt));
          else if (list.length === 1) pick(list[0].value);
        }
      },
    };
  }
}
</script>
</body>
</html>
