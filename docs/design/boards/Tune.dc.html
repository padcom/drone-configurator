<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tune</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A0F14}
a{color:#56D9F2}a:hover{color:#8FE7F7}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #56D9F2;outline-offset:2px}
</style>
<style data-shell>
[data-l~="measure"]>*{max-width:var(--measure)}
@media (min-width:1000px){
html:has([data-l~="app"]),body:has([data-l~="app"]){height:100%;overflow:hidden}
[data-l~="app"]{height:100vh;min-height:0!important;overflow:hidden}
[data-l~="row"]{flex-wrap:nowrap!important;min-height:0}
[data-l~="fill"]{flex:1 1 0!important;min-height:0}
[data-l~="clip"]{min-height:0;overflow:hidden}
[data-l~="pane"]{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#60728A transparent}
[data-l~="pane"][data-l~="col"]>*:not([data-l~="map"]){flex-shrink:0!important}
[data-l~="map"]{min-width:0;min-height:240px!important}
}
</style>
</helmet>
<div data-l="app" style="min-height:900px;display:flex;flex-direction:column;background:#0A0F14;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.4">
  <dc-import name="TopBar" status="disarmed" hint-size="100%,64px"></dc-import>
  <div data-l="row fill" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:stretch">
    <div data-l="pane" style="flex:1 1 76px;background:#111921;border-right:1px solid #25323E">
      <dc-import name="Rail" active="tune" hint-size="76px,640px"></dc-import>
    </div>
    <main data-l="row" style="flex:999 1 560px;min-width:0;display:flex;flex-wrap:wrap;align-items:stretch">
      <section data-l="pane col" style="flex:999 1 520px;min-width:0;box-sizing:border-box;padding:24px 28px;display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
          <div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap"><h1 style="margin:0;font-size:28px;font-weight:600">Roll and pitch response</h1><a href="TuneFilters.dc.html">Noise filters</a></div>
          <div role="group" aria-label="Controller" style="display:flex;border:1px solid #60728A;border-radius:4px;overflow:hidden">
            <sc-for list="{{tabs}}" as="b" hint-placeholder-count="4">
              <a href="{{b.href}}" style="display:flex;align-items:center;min-height:44px;padding:0 14px;background:{{b.bg}};color:{{b.fg}};font-weight:500;text-decoration:none">{{b.label}}</a>
            </sc-for>
          </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px">
          <sc-for list="{{metrics}}" as="m" hint-placeholder-count="3">
            <div style="flex:1 1 150px;padding:14px 16px;background:#111921;border:1px solid #25323E;border-radius:5px">
              <div style="font-size:11px;font-weight:500;letter-spacing:.08em;color:#A9B8C5">{{m.label}}</div>
              <div style="font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600">{{m.value}}</div>
              <div style="font-size:12.5px;color:{{m.noteFg}}">{{m.note}}</div>
            </div>
          </sc-for>
        </div>
        <figure style="margin:0;flex:1 1 360px;display:flex;flex-direction:column;gap:8px;padding:14px 16px;background:#111921;border:1px solid #25323E;border-radius:5px">
          <figcaption style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12.5px;color:#A9B8C5">
            <span style="font-weight:600;color:#E8EEF4;font-size:14px">Roll rate, deg/s</span>
            <span style="display:inline-flex;align-items:center;gap:6px"><span aria-hidden="true" style="width:16px;height:2px;background:#56D9F2"></span>Actual</span>
            <span style="display:inline-flex;align-items:center;gap:6px"><span aria-hidden="true" style="width:16px;border-top:2px dashed #A9B8C5"></span>Desired</span>
            <span style="flex:1 1 auto"></span>
            <span style="font-family:'IBM Plex Mono',monospace;color:#E8EEF4">{{readout}}</span>
          </figcaption>
          <div onMouseMove="{{hoverMove}}" onMouseLeave="{{hoverOut}}" style="position:relative;flex:1 1 300px;min-height:300px">
            <svg viewBox="0 0 1000 300" preserveAspectRatio="none" role="img" aria-label="{{chartLabel}}" style="position:absolute;inset:0;width:100%;height:100%">
              <sc-for list="{{grid}}" as="g" hint-placeholder-count="3">
                <line x1="0" x2="1000" y1="{{g.y}}" y2="{{g.y}}" stroke="#25323E" vector-effect="non-scaling-stroke"></line>
              </sc-for>
              <polyline points="{{desiredPts}}" fill="none" stroke="#A9B8C5" stroke-width="1.5" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"></polyline>
              <polyline points="{{actualPts}}" fill="none" stroke="#56D9F2" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
              <line x1="{{hx}}" x2="{{hx}}" y1="0" y2="300" stroke="#E8EEF4" stroke-opacity="{{ho}}" vector-effect="non-scaling-stroke"></line>
            </svg>
            <sc-for list="{{grid}}" as="g" hint-placeholder-count="3">
              <span style="position:absolute;left:2px;top:{{g.top}};font-family:'IBM Plex Mono',monospace;font-size:11px;color:#A9B8C5">{{g.label}}</span>
            </sc-for>
          </div>
        </figure>
      </section>
      <aside data-l="pane col" style="flex:1 1 360px;min-width:0;box-sizing:border-box;background:#111921;border-left:1px solid #25323E;padding:22px 20px;display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <h2 style="margin:0;font-size:12px;font-weight:600;letter-spacing:.09em;color:#A9B8C5">RATE CONTROLLER</h2>
          <button type="button" onClick="{{toggleLink}}" aria-pressed="{{linked}}" style="min-height:44px;padding:0 12px;border:1px solid #60728A;border-radius:4px;background:{{linkBg}};color:{{linkFg}};font:inherit;font-size:13px;font-weight:500;cursor:pointer">{{linkLabel}}</button>
        </div>
        <sc-for list="{{sliders}}" as="s" hint-placeholder-count="4">
          <label style="display:flex;flex-direction:column;gap:2px;color:#A9B8C5;font-size:13px">
            <span style="display:flex;justify-content:space-between;gap:8px"><span>{{s.label}}</span><span style="font-family:'IBM Plex Mono',monospace;color:{{s.fg}};font-size:15px">{{s.text}}</span></span>
            <input type="range" min="{{s.min}}" max="{{s.max}}" step="{{s.step}}" value="{{s.value}}" onChange="{{s.change}}" style="accent-color:#56D9F2;min-height:40px;margin:0">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8FA0AE">{{s.param}}</span>
          </label>
        </sc-for>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button type="button" onClick="{{revert}}" style="flex:1 1 100px;min-height:48px;border:1px solid #60728A;border-radius:4px;background:transparent;color:#E8EEF4;font:inherit;font-weight:500;cursor:pointer">Revert</button>
          <button type="button" onClick="{{save}}" style="flex:2 1 140px;min-height:48px;border:0;border-radius:4px;background:#56D9F2;color:#06222B;font:inherit;font-weight:600;cursor:pointer">{{saveLabel}}</button>
        </div>
        <div style="margin-top:auto;padding:14px;border:1px solid #25323E;border-radius:5px;display:flex;flex-direction:column;gap:8px">
          <h2 style="margin:0;font-size:14px;font-weight:600">AutoTune</h2>
          <p style="margin:0;color:#A9B8C5;font-size:13px">Tunes in flight on a calm day. Assign it to a transmitter switch, then fly in AltHold.</p>
          <a href="SetupRadio.dc.html" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #60728A;border-radius:4px;color:#E8EEF4;text-decoration:none;font-weight:500">Assign a switch</a>
        </div>
      </aside>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { P:.135, I:.135, D:.0036, FF:0, linked:true, tab:'Rate', saved:false, hover:null };
  renderVals() {
    const s = this.state;
    const W = 6 + s.P*60;
    const Z = Math.max(.08, Math.min(.95, (.12 + s.D*110) * Math.sqrt(.135/s.P)));
    const wd = W*Math.sqrt(1-Z*Z);
    const step = (t) => t <= 0 ? 0 : 1 - Math.exp(-Z*W*t)*(Math.cos(wd*t)+Z/Math.sqrt(1-Z*Z)*Math.sin(wd*t));
    const A = 30, T1 = .5, T2 = 2.75, DUR = 5;
    const desired = (t) => (t >= T1 && t < T2) ? A : 0;
    const actual = (t) => A*(step(t-T1) - step(t-T2));
    const Y = (v) => (300 - (v+10)/50*300).toFixed(1);
    let aPts = '', dPts = '';
    for (let i = 0; i <= 250; i++) {
      const t = i/250*DUR, x = (i*4);
      aPts += x + ',' + Y(actual(t)) + ' ';
      dPts += x + ',' + Y(desired(t)) + ' ';
    }
    const over = Math.exp(-Math.PI*Z/Math.sqrt(1-Z*Z))*100;
    const settle = 4/(Z*W);
    const rise = 1.8/W;
    const noisy = over > 25;
    const orig = s.P===.135 && s.D===.0036 && s.I===.135 && s.FF===0;
    const slider = (key,label,param,min,max,step_,dig,base) => ({
      label, param, min, max, step:step_, value:s[key], text:s[key].toFixed(dig), fg:s[key]===base?'#E8EEF4':'#56D9F2',
      change:(e) => this.setState({ [key]:Number(e.target.value), saved:false }),
    });
    const g = [40,20,0].map((v) => ({ y:Y(v), label:String(v), top:(Number(Y(v))-16)+'px' }));
    const h = s.hover;
    const ht = h == null ? 0 : h*DUR;
    return {
      tabs:[['Rate','Tune.dc.html'],['More groups','TuneGroups.dc.html'],['Filters','TuneFilters.dc.html']].map(([label,href]) => ({ label, href, bg:label==='Rate'?'#56D9F2':'transparent', fg:label==='Rate'?'#06222B':'#E8EEF4' })),
      metrics:[
        { label:'OVERSHOOT', value:over.toFixed(0)+'%', note:noisy?'⚠ Risk of oscillation':'Within target', noteFg:noisy?'#FFB54A':'#A9B8C5' },
        { label:'RISE TIME', value:(rise*1000).toFixed(0)+' ms', note:'10 to 90%', noteFg:'#A9B8C5' },
        { label:'SETTLING', value:settle.toFixed(2)+' s', note:'To within 2%', noteFg:'#A9B8C5' },
      ],
      desiredPts:dPts.trim(), actualPts:aPts.trim(), grid:g,
      chartLabel:'Step response: overshoot ' + over.toFixed(0) + ' percent, settling in ' + settle.toFixed(2) + ' seconds',
      readout:h==null?'Hover for values':ht.toFixed(2)+' s · desired '+desired(ht).toFixed(0)+' · actual '+actual(ht).toFixed(1),
      hoverMove:(e) => { const r = e.currentTarget.getBoundingClientRect(); this.setState({ hover:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)) }); },
      hoverOut:() => this.setState({ hover:null }),
      hx:h==null?0:(h*1000).toFixed(0), ho:h==null?0:.7,
      linked:s.linked, toggleLink:() => this.setState({ linked:!s.linked }),
      linkBg:s.linked?'#123440':'transparent', linkFg:s.linked?'#56D9F2':'#E8EEF4',
      linkLabel:s.linked?'Roll and pitch linked':'Roll and pitch separate',
      sliders:[
        slider('P','P, how hard it corrects','ATC_RAT_RLL_P',.05,.3,.005,3,.135),
        slider('I','I, removes steady error','ATC_RAT_RLL_I',.05,.3,.005,3,.135),
        slider('D','D, damps the motion','ATC_RAT_RLL_D',.001,.01,.0002,4,.0036),
        slider('FF','FF, feeds the stick forward','ATC_RAT_RLL_FF',0,.5,.01,2,0),
      ],
      revert:() => this.setState({ P:.135, I:.135, D:.0036, FF:0, saved:false }),
      save:() => this.setState({ saved:true }),
      saveLabel:s.saved?'Written and read back':orig?'No changes':'Write and verify',
    };
  }
}
</script>
</body>
</html>
