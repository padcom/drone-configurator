<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A0F14}
a{color:#56D9F2}a:hover{color:#8FE7F7}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #56D9F2;outline-offset:2px}
</style>
<style data-shell>
[data-l~="measure"]>*{max-width:var(--measure)}
@media (min-width:1000px){
html:has([data-l~="app"]),body:has([data-l~="app"]){height:100%;overflow:hidden}
[data-l~="app"]{height:100vh;min-height:0!important;overflow:hidden}
[data-l~="row"]{flex-wrap:nowrap!important;min-height:0}
[data-l~="fill"]{flex:1 1 0!important;min-height:0}
[data-l~="clip"]{min-height:0;overflow:hidden}
[data-l~="pane"]{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#60728A transparent}
[data-l~="pane"][data-l~="col"]>*:not([data-l~="map"]){flex-shrink:0!important}
[data-l~="map"]{min-width:0;min-height:240px!important}
}
</style>
</helmet>
<div data-l="app" style="min-height:900px;display:flex;flex-direction:column;background:#0A0F14;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.4">
  <dc-import name="TopBar" status="disarmed" hint-size="100%,64px"></dc-import>
  <div data-l="row fill" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:stretch">
    <div data-l="pane" style="flex:1 1 76px;background:#111921;border-right:1px solid #25323E"><dc-import name="Rail" active="setup" hint-size="76px,640px"></dc-import></div>
    <main data-l="row" style="flex:999 1 560px;min-width:0;display:flex;flex-wrap:wrap;align-items:stretch">
      <div data-l="pane" style="flex:1 1 240px;min-width:0;background:#111921;border-right:1px solid #25323E"><dc-import name="SetupNav" active="radio" hint-size="240px,800px"></dc-import></div>
      <section data-l="pane col" style="flex:999 1 480px;min-width:0;box-sizing:border-box;padding:28px 32px;display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between">
          <div>
            <h1 style="margin:0;font-size:28px;font-weight:600">Radio</h1>
            <p style="margin:6px 0 0;color:#A9B8C5;font-size:15px">{{instruction}}</p>
          </div>
          <a href="SetupMotors.dc.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid #60728A;border-radius:4px;color:#E8EEF4;font-weight:500;text-decoration:none">Next: Motors and ESCs</a>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:center">
          <sc-for list="{{sticks}}" as="g" hint-placeholder-count="2">
            <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:6px">
              <svg viewBox="0 0 150 150" role="img" aria-label="{{g.aria}}" style="width:150px;height:150px">
                <rect x="4" y="4" width="142" height="142" rx="6" fill="#111921" stroke="#25323E"></rect>
                <line x1="75" y1="10" x2="75" y2="140" stroke="#25323E"></line><line x1="10" y1="75" x2="140" y2="75" stroke="#25323E"></line>
                <circle cx="{{g.x}}" cy="{{g.y}}" r="12" fill="#56D9F2"></circle>
              </svg>
              <figcaption style="font-size:12.5px;color:#A9B8C5">{{g.label}}</figcaption>
            </figure>
          </sc-for>
        </div>
        <div style="display:flex;flex-direction:column;gap:7px">
          <sc-for list="{{channels}}" as="c" hint-placeholder-count="8">
            <div style="display:flex;align-items:center;gap:12px">
              <span style="width:118px;font-size:13px;font-weight:500">{{c.name}}</span>
              <div style="position:relative;flex:1;height:16px;border-radius:2px;background:#111921;border:1px solid #25323E">
                <span style="position:absolute;top:0;bottom:0;left:{{c.minP}};width:{{c.widthP}};background:#123440"></span>
                <span style="position:absolute;top:-2px;bottom:-2px;left:{{c.valP}};width:3px;margin-left:-1px;background:#56D9F2"></span>
              </div>
              <span style="width:50px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px">{{c.value}}</span>
              <span style="width:84px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A9B8C5">{{c.range}}</span>
            </div>
          </sc-for>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:auto">
          <button type="button" onClick="{{toggle}}" style="min-height:48px;padding:0 22px;border:{{calBorder}};border-radius:4px;background:{{calBg}};color:{{calFg}};font:inherit;font-weight:600;cursor:pointer">{{calLabel}}</button>
          <sc-if value="{{saved}}" hint-placeholder-val="{{false}}"><span style="align-self:center;color:#62E3A6;font-weight:500">✓ Written and read back</span></sc-if>
        </div>
      </section>
      <aside data-l="pane col" style="flex:1 1 280px;min-width:0;box-sizing:border-box;background:#111921;border-left:1px solid #25323E;padding:24px 20px;display:flex;flex-direction:column;gap:14px">
        <h2 style="margin:0;font-size:12px;font-weight:600;letter-spacing:.09em;color:#A9B8C5">SWITCHES</h2>
        <sc-for list="{{aux}}" as="a" hint-placeholder-count="2">
          <div style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A9B8C5">
            <span style="display:flex;justify-content:space-between"><span>{{a.name}}</span><span style="font-family:'IBM Plex Mono',monospace;color:{{a.stateFg}}">{{a.state}}</span></span>
            <dc-import name="EnumField" value="{{a.value}}" options="{{auxOptions}}" on-pick="{{a.pick}}" field-label="{{a.name}} function" hint-size="100%,44px"></dc-import>
          </div>
        </sc-for>
        <p style="margin:0;color:#A9B8C5;font-size:13px">Channel 5 is reserved for flight modes. <a href="SetupModes.dc.html">Assign modes</a></p>
        <div style="margin-top:auto">
          <h2 style="margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.09em;color:#A9B8C5">WHAT THIS WRITES</h2>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#A9B8C5;display:flex;flex-direction:column;gap:4px"><span>RC1_MIN … RC8_MAX</span><span>RC7_OPTION = {{opt7}}</span><span>RC8_OPTION = {{opt8}}</span></div>
        </div>
      </aside>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { n:0, cal:false, saved:false, min:null, max:null, opt7:4, opt8:9 };
  componentDidMount() {
    this.timer = setInterval(() => this.setState((s) => {
      const n = s.n + 1;
      if (!s.cal) return { n };
      const v = this.values(n, true);
      return { n, min:v.map((x,i) => Math.min(s.min[i],x)), max:v.map((x,i) => Math.max(s.max[i],x)) };
    }), 150);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  values(n, cal) {
    const amp = cal ? 410 : 90;
    const w = (i,sp) => 1500 + Math.round(amp*Math.sin(n*sp+i));
    return [w(0,.13), w(1,.09), cal ? w(2,.11) : 1120, w(3,.07), 1500, 1500, cal ? (n%24<12?1100:1900) : 1100, cal ? (n%30<15?1900:1100) : 1100];
  }
  renderVals() {
    const s = this.state;
    const v = this.values(s.n, s.cal);
    const names = ['1 · Roll','2 · Pitch','3 · Throttle','4 · Yaw','5 · Flight mode','6 · Unused','7 · Switch','8 · Switch'];
    const P = (x) => ((x-800)/1400*100).toFixed(1)+'%';
    const mins = s.cal ? s.min : v.map(() => 1100), maxs = s.cal ? s.max : v.map(() => 1900);
    const pos = (x) => (75+(x-1500)/400*62).toFixed(1);
    const labels = [['None',0],['Return home',4],['Camera trigger',9],['AutoTune',17],['Landing gear',29],['Brake',33]].map(([label,value]) => ({ label,value }));
    const on = (val) => val > 1500;
    const aux = [7,8].map((c) => ({ name:'Channel '+c, value:s['opt'+c], state:on(v[c-1])?'ON':'OFF', stateFg:on(v[c-1])?'#56D9F2':'#A9B8C5', pick:(n) => this.setState({ ['opt'+c]:n }) }));
    const named = (n) => n+' · '+(labels.find((o) => o.value === n)?.label ?? 'no name');
    return {
      sticks:[
        { label:'Throttle and yaw', x:pos(v[3]), y:pos(3000-v[2]), aria:'Left stick position' },
        { label:'Pitch and roll', x:pos(v[0]), y:pos(3000-v[1]), aria:'Right stick position' },
      ],
      channels:names.map((name,i) => ({ name, value:v[i], valP:P(v[i]), minP:P(mins[i]), widthP:((maxs[i]-mins[i])/1400*100).toFixed(1)+'%', range:mins[i]+'–'+maxs[i] })),
      instruction:s.cal?'Move every stick and switch to both ends, several times. The shaded range grows as you go.':'The transmitter is calibrated. Move a stick to check that the matching bar follows.',
      calLabel:s.cal?'Finish and save':'Calibrate radio',
      calBg:s.cal?'#56D9F2':'transparent', calFg:s.cal?'#06222B':'#E8EEF4', calBorder:s.cal?'0':'1px solid #60728A',
      saved:s.saved,
      toggle:() => s.cal ? this.setState({ cal:false, saved:true }) : this.setState({ cal:true, saved:false, min:v.slice(), max:v.slice() }),
      aux, auxOptions:labels, opt7:named(s.opt7), opt8:named(s.opt8),
    };
  }
}
</script>
</body>
</html>
