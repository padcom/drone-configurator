<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corridor scan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A0F14}
a{color:#56D9F2}a:hover{color:#8FE7F7}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #56D9F2;outline-offset:2px}
</style>
<style data-shell>
[data-l~="measure"]>*{max-width:var(--measure)}
@media (min-width:1000px){
html:has([data-l~="app"]),body:has([data-l~="app"]){height:100%;overflow:hidden}
[data-l~="app"]{height:100vh;min-height:0!important;overflow:hidden}
[data-l~="row"]{flex-wrap:nowrap!important;min-height:0}
[data-l~="fill"]{flex:1 1 0!important;min-height:0}
[data-l~="clip"]{min-height:0;overflow:hidden}
[data-l~="pane"]{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#60728A transparent}
[data-l~="pane"][data-l~="col"]>*:not([data-l~="map"]){flex-shrink:0!important}
[data-l~="map"]{min-width:0;min-height:240px!important}
}
</style>
</helmet>
<div data-l="app" style="min-height:900px;display:flex;flex-direction:column;background:#0A0F14;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.4">
  <dc-import name="TopBar" status="disarmed" hint-size="100%,64px"></dc-import>
  <div data-l="row fill" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:stretch">
    <div data-l="pane" style="flex:1 1 76px;background:#111921;border-right:1px solid #25323E"><dc-import name="Rail" active="plan" hint-size="76px,640px"></dc-import></div>
    <main data-l="clip" style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
      <dc-import name="PlanBar" active="corridor" hint-size="100%,66px"></dc-import>
      <div data-l="fill row" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:stretch">
        <section data-l="clip" style="flex:999 1 520px;min-width:0;display:flex;flex-direction:column">
          <div data-l="fill map" style="flex:1 1 480px;min-height:480px;position:relative;overflow:hidden">
            <dc-import name="MapBase" hint-size="100%,480px"></dc-import>
            <svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="{{aria}}" style="position:absolute;inset:0;width:100%;height:100%">
              <polygon points="{{band}}" fill="#56D9F2" fill-opacity=".12" stroke="#56D9F2" stroke-width="2" stroke-dasharray="8 6"></polygon>
              <polyline points="{{route}}" fill="none" stroke="#EE82F5" stroke-width="3" stroke-linejoin="round"></polyline>
              <polyline points="{{center}}" fill="none" stroke="#E8EEF4" stroke-width="2" stroke-dasharray="3 7"></polyline>
              <sc-for list="{{handles}}" as="c" hint-placeholder-count="4"><rect x="{{c.x}}" y="{{c.y}}" width="14" height="14" rx="1" fill="#0A0F14" stroke="#56D9F2" stroke-width="3"></rect></sc-for>
              <line x1="40" y1="860" x2="140" y2="860" stroke="#E8EEF4" stroke-width="3"></line>
              <text x="40" y="845" fill="#E8EEF4" font-family="IBM Plex Mono, monospace" font-size="20">50 m</text>
            </svg>
          </div>
          <div style="display:flex;flex-wrap:wrap;background:#111921;border-top:1px solid #25323E">
            <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
              <div style="flex:1 1 110px;padding:10px 16px;border-right:1px solid #25323E">
                <div style="font-size:11px;letter-spacing:.08em;font-weight:500;color:#A9B8C5">{{s.label}}</div>
                <div style="font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600">{{s.value}}</div>
              </div>
            </sc-for>
          </div>
        </section>
        <aside data-l="pane col" style="flex:1 1 340px;min-width:0;box-sizing:border-box;background:#111921;border-left:1px solid #25323E;padding:20px;display:flex;flex-direction:column;gap:14px">
          <div>
            <h1 style="margin:0;font-size:20px;font-weight:600">Corridor scan</h1>
            <p style="margin:4px 0 0;color:#A9B8C5">Covers a strip along a road, river or power line. Draw the centre line on the map.</p>
          </div>
          <sc-for list="{{sliders}}" as="f" hint-placeholder-count="3">
            <label style="display:flex;flex-direction:column;font-size:13px;color:#A9B8C5">
              <span style="display:flex;justify-content:space-between"><span>{{f.label}}</span><span style="font-family:'IBM Plex Mono',monospace;color:#E8EEF4;font-size:15px">{{f.value}} m</span></span>
              <input type="range" min="{{f.min}}" max="{{f.max}}" step="{{f.step}}" value="{{f.value}}" onChange="{{f.change}}" style="accent-color:#56D9F2;min-height:40px;margin:0">
            </label>
          </sc-for>
          <label style="display:flex;gap:12px;align-items:center;min-height:44px;cursor:pointer"><input type="checkbox" checked="{{camera}}" onChange="{{cameraChange}}" style="width:20px;height:20px;accent-color:#56D9F2;margin:0"><span>Take photos every 18 m</span></label>
          <button type="button" onClick="{{add}}" style="min-height:48px;margin-top:auto;border:0;border-radius:4px;background:{{addBg}};color:{{addFg}};font:inherit;font-weight:600;cursor:pointer">{{addLabel}}</button>
        </aside>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { width:60, spacing:20, alt:50, camera:true, added:false };
  renderVals() {
    const s = this.state;
    const C = [[260,640],[420,655],[620,690],[860,655]];
    const norm = C.map((p,i) => {
      const a = C[Math.max(0,i-1)], b = C[Math.min(C.length-1,i+1)];
      const dx = b[0]-a[0], dy = b[1]-a[1], l = Math.hypot(dx,dy);
      return [-dy/l, dx/l];
    });
    const off = (d) => C.map((p,i) => [p[0]+norm[i][0]*d, p[1]+norm[i][1]*d]);
    const str = (a) => a.map((p) => p[0].toFixed(0)+','+p[1].toFixed(0)).join(' ');
    const lines = Math.floor(s.width/s.spacing)+1;
    const span = (lines-1)*s.spacing;
    let path = [];
    for (let k = 0; k < lines; k++) {
      const l = off((-span/2 + k*s.spacing)*2);
      path = path.concat(k%2 ? l.slice().reverse() : l);
    }
    let len = 0;
    for (let i = 1; i < path.length; i++) len += Math.hypot(path[i][0]-path[i-1][0], path[i][1]-path[i-1][1]);
    const m = len*.5, secs = m/8 + lines*8;
    const up = off(s.width), down = off(-s.width).reverse();
    const set = (k) => (e) => this.setState({ [k]:Number(e.target.value), added:false });
    return {
      band:str(up.concat(down)), route:str(path), center:str(C),
      handles:C.map((p) => ({ x:p[0]-7, y:p[1]-7 })),
      aria:'Corridor '+s.width+' metres wide, covered by '+lines+' lines',
      stats:[
        { label:'LINES', value:String(lines) },
        { label:'LENGTH', value:(m/1000).toFixed(2)+' km' },
        { label:'TIME AT 8 M/S', value:Math.floor(secs/60)+' min '+String(Math.round(secs%60)).padStart(2,'0')+' s' },
        { label:'PHOTOS', value:s.camera?String(Math.floor(m/18)):'—' },
      ],
      sliders:[
        { label:'Corridor width',min:20,max:120,step:5,value:s.width,change:set('width') },
        { label:'Line spacing',min:10,max:40,step:1,value:s.spacing,change:set('spacing') },
        { label:'Altitude above home',min:20,max:120,step:5,value:s.alt,change:set('alt') },
      ],
      camera:s.camera, cameraChange:(e) => this.setState({ camera:e.target.checked, added:false }),
      add:() => this.setState({ added:true }),
      addBg:s.added?'#123327':'#56D9F2', addFg:s.added?'#62E3A6':'#06222B',
      addLabel:s.added?'✓ Added to the mission':'Add to the mission',
    };
  }
}
</script>
</body>
</html>
