<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logs: spectrum</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0A0F14}
a{color:#56D9F2}a:hover{color:#8FE7F7}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #56D9F2;outline-offset:2px}
</style>
<style data-shell>
[data-l~="measure"]>*{max-width:var(--measure)}
@media (min-width:1000px){
html:has([data-l~="app"]),body:has([data-l~="app"]){height:100%;overflow:hidden}
[data-l~="app"]{height:100vh;min-height:0!important;overflow:hidden}
[data-l~="row"]{flex-wrap:nowrap!important;min-height:0}
[data-l~="fill"]{flex:1 1 0!important;min-height:0}
[data-l~="clip"]{min-height:0;overflow:hidden}
[data-l~="pane"]{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#60728A transparent}
[data-l~="pane"][data-l~="col"]>*:not([data-l~="map"]){flex-shrink:0!important}
[data-l~="map"]{min-width:0;min-height:240px!important}
}
</style>
</helmet>
<div data-l="app" style="min-height:900px;display:flex;flex-direction:column;background:#0A0F14;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.4">
  <dc-import name="TopBar" status="disarmed" hint-size="100%,64px"></dc-import>
  <div data-l="row fill" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:stretch">
    <div data-l="pane" style="flex:1 1 76px;background:#111921;border-right:1px solid #25323E"><dc-import name="Rail" active="logs" hint-size="76px,640px"></dc-import></div>
    <main data-l="clip" style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
      <dc-import name="LogsNav" active="spectrum" hint-size="100%,56px"></dc-import>
      <div data-l="fill row" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:stretch">
        <section data-l="pane col" style="flex:999 1 520px;min-width:0;box-sizing:border-box;padding:20px 24px;display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
            <h1 style="margin:0;font-size:26px;font-weight:600">Vibration spectrum</h1>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
              <label style="display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer"><input type="checkbox" checked="{{notch}}" onChange="{{notchChange}}" style="width:20px;height:20px;accent-color:#56D9F2;margin:0"><span>Preview the notch filter</span></label>
              <div role="group" aria-label="Axis" style="display:flex;border:1px solid #60728A;border-radius:4px;overflow:hidden">
                <sc-for list="{{axes}}" as="b" hint-placeholder-count="3"><button type="button" onClick="{{b.pick}}" style="min-height:44px;width:48px;border:0;background:{{b.bg}};color:{{b.fg}};font:inherit;font-weight:600;cursor:pointer">{{b.label}}</button></sc-for>
              </div>
            </div>
          </div>
          <figure style="margin:0;flex:1 1 230px;display:flex;flex-direction:column;gap:6px;padding:12px 16px;background:#111921;border:1px solid #25323E;border-radius:5px">
            <figcaption style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span style="font-weight:600">Amplitude by frequency</span><span style="font-family:'IBM Plex Mono',monospace;color:#A9B8C5">{{readout}}</span></figcaption>
            <div onMouseMove="{{hoverMove}}" onMouseLeave="{{hoverOut}}" style="position:relative;flex:1 1 190px;min-height:190px">
              <svg viewBox="0 0 1000 200" preserveAspectRatio="none" role="img" aria-label="{{aria}}" style="position:absolute;inset:0;width:100%;height:100%">
                <line x1="0" x2="1000" y1="100" y2="100" stroke="#25323E" vector-effect="non-scaling-stroke"></line>
                <polyline points="{{line}}" fill="none" stroke="#56D9F2" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
                <line x1="{{hx}}" x2="{{hx}}" y1="0" y2="200" stroke="#E8EEF4" stroke-opacity="{{ho}}" vector-effect="non-scaling-stroke"></line>
              </svg>
            </div>
            <div style="display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#A9B8C5"><span>0 Hz</span><span>100</span><span>200</span><span>300 Hz</span></div>
          </figure>
          <figure style="margin:0;flex:1 1 220px;display:flex;flex-direction:column;gap:6px;padding:12px 16px;background:#111921;border:1px solid #25323E;border-radius:5px">
            <figcaption style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span style="font-weight:600">Frequency over the flight</span><span style="display:inline-flex;gap:6px;align-items:center;color:#A9B8C5">weak <span aria-hidden="true" style="display:inline-flex"><span style="width:14px;height:10px;background:#16303A"></span><span style="width:14px;height:10px;background:#2A6E80"></span><span style="width:14px;height:10px;background:#56D9F2"></span></span> strong</span></figcaption>
            <svg viewBox="0 0 800 200" preserveAspectRatio="none" role="img" aria-label="Spectrogram: a band near {{peak}} hertz through the flight" style="display:block;width:100%;flex:1 1 170px;min-height:170px">
              <sc-for list="{{cells}}" as="c" hint-placeholder-count="200"><rect x="{{c.x}}" y="{{c.y}}" width="20.5" height="10.5" fill="#56D9F2" fill-opacity="{{c.o}}"></rect></sc-for>
            </svg>
            <div style="display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#A9B8C5"><span>Takeoff</span><span>Landing · vertical 0 to 300 Hz</span></div>
          </figure>
        </section>
        <aside data-l="pane col" style="flex:1 1 320px;min-width:0;box-sizing:border-box;background:#111921;border-left:1px solid #25323E;padding:20px;display:flex;flex-direction:column;gap:14px">
          <div style="padding:14px;border:1px solid #FFB54A;border-radius:5px;background:#3A2A10">
            <div style="font-weight:600">Motor noise at {{peak}} Hz</div>
            <div style="color:#E8EEF4;font-size:13px">With harmonics at {{h2}} and {{h3}} Hz. A harmonic notch filter removes this.</div>
          </div>
          <h2 style="margin:4px 0 0;font-size:12px;font-weight:600;letter-spacing:.09em;color:#A9B8C5">SUGGESTED SETTINGS</h2>
          <sc-for list="{{settings}}" as="p" hint-placeholder-count="4">
            <div style="display:flex;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:1px solid #25323E;font-family:'IBM Plex Mono',monospace;font-size:13px"><span style="color:#A9B8C5">{{p.name}}</span><span>{{p.value}}</span></div>
          </sc-for>
          <button type="button" onClick="{{apply}}" style="min-height:48px;border:0;border-radius:4px;background:{{applyBg}};color:{{applyFg}};font:inherit;font-weight:600;cursor:pointer">{{applyLabel}}</button>
          <sc-if value="{{applied}}" hint-placeholder-val="{{false}}"><a href="Parameters.dc.html">Review them in Parameters</a></sc-if>
          <p style="margin:auto 0 0;font-size:13px;color:#A9B8C5">Fly again after changing the filter, and compare with this log.</p>
        </aside>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { axis:'X', notch:false, hover:null, applied:false };
  renderVals() {
    const s = this.state;
    const scale = { X:1, Y:.8, Z:1.3 }[s.axis];
    const PEAK = 82;
    const g = (f,c,w) => Math.exp(-Math.pow((f-c)/w,2));
    const reduce = s.notch ? .1 : 1;
    const amp = (f) => .05 + .04*Math.sin(f*.37)*Math.sin(f*.11) + scale*reduce*(1*g(f,PEAK,6)+.5*g(f,PEAK*2,7)+.25*g(f,PEAK*3,8));
    const MAX = 1.5;
    let line = '';
    for (let i = 0; i <= 300; i++) { const f = i; line += (i/300*1000).toFixed(0)+','+(200-amp(f)/MAX*200).toFixed(1)+' '; }
    const cells = [];
    for (let c = 0; c < 40; c++) {
      const t = c/39, drift = 8*Math.sin(t*6) + 6;
      for (let r = 0; r < 20; r++) {
        const f = 300-(r+.5)*15;
        const v = .05 + scale*reduce*(1*g(f,PEAK+drift,12)+.5*g(f,(PEAK+drift)*2,14)+.25*g(f,(PEAK+drift)*3,16))*(t<.05||t>.95?.2:1);
        cells.push({ x:c*20, y:r*10, o:Math.min(1,v/1.3).toFixed(2) });
      }
    }
    const h = s.hover, hf = h == null ? null : Math.round(h*300);
    return {
      line:line.trim(), cells, notch:s.notch, peak:PEAK, h2:PEAK*2, h3:PEAK*3,
      aria:'Spectrum on the '+s.axis+' axis with a peak at '+PEAK+' hertz',
      axes:['X','Y','Z'].map((label) => ({ label, pick:() => this.setState({ axis:label }), bg:s.axis===label?'#56D9F2':'transparent', fg:s.axis===label?'#06222B':'#E8EEF4' })),
      notchChange:(e) => this.setState({ notch:e.target.checked }),
      readout:hf==null?'Peak '+PEAK+' Hz':hf+' Hz · '+amp(hf).toFixed(2),
      hoverMove:(e) => { const r = e.currentTarget.getBoundingClientRect(); this.setState({ hover:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)) }); },
      hoverOut:() => this.setState({ hover:null }),
      hx:h==null?0:(h*1000).toFixed(0), ho:h==null?0:.7,
      settings:[
        { name:'INS_HNTCH_ENABLE', value:'1 · On' },
        { name:'INS_HNTCH_FREQ', value:PEAK },
        { name:'INS_HNTCH_BW', value:Math.round(PEAK/2) },
        { name:'INS_HNTCH_HMNCS', value:'7 (first three)' },
      ],
      applied:s.applied, apply:() => this.setState({ applied:true }),
      applyBg:s.applied?'#123327':'#56D9F2', applyFg:s.applied?'#62E3A6':'#06222B',
      applyLabel:s.applied?'✓ Added to Parameters changes':'Add to Parameters changes',
    };
  }
}
</script>
</body>
</html>
