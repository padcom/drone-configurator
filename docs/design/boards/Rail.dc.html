<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Screens" style="display:flex;flex-flow:row wrap;gap:4px;padding:8px 0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:{{t.text2}}">
  <sc-for list="{{items}}" as="i" hint-placeholder-count="7">
    <a href="{{i.href}}" style="flex:0 0 76px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:68px;padding:0 2px;text-decoration:none;font-size:11.5px;font-weight:500;color:{{i.fg}}">
      <span style="display:flex;align-items:center;justify-content:center;width:48px;height:32px;border-radius:5px;background:{{i.bg}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"></path></svg>
      </span>
      <span>{{i.label}}</span>
    </a>
  </sc-for>
  <a href="Preferences.dc.html" style="flex:0 0 76px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:68px;margin-top:16px;border-top:1px solid {{t.line}};text-decoration:none;font-size:11.5px;font-weight:500;color:{{prefFg}}">
    <span style="display:flex;align-items:center;justify-content:center;width:48px;height:32px;border-radius:5px;background:{{prefBg}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path></svg>
    </span>
    <span>Settings</span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","plan","fly","setup","parameters","tune","logs"],"default":"overview"},"$preview":{"width":76,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'overview';
    const t = { line:'#25323E', text2:'#A9B8C5', accent:'#56D9F2', accentBg:'#123440' };
    const items = [
      { id:'overview', label:'Overview', href:'Main.dc.html', d:'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z' },
      { id:'plan', label:'Plan', href:'Plan.dc.html', d:'M6 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM18 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8' },
      { id:'fly', label:'Fly', href:'Fly.dc.html', d:'M12 2l8 19-8-4-8 4z' },
      { id:'setup', label:'Setup', href:'SetupHome.dc.html', d:'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z' },
      { id:'parameters', label:'Parameters', href:'Parameters.dc.html', d:'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6' },
      { id:'tune', label:'Tune', href:'Tune.dc.html', d:'M22 12h-4l-3 9L9 3l-3 9H2' },
      { id:'logs', label:'Logs', href:'Logs.dc.html', d:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8M10 9H8' },
    ].map((i) => ({ ...i, fg: i.id === active ? t.accent : t.text2, bg: i.id === active ? t.accentBg : 'transparent' }));
    return { t, items, prefFg: active === 'preferences' ? t.accent : t.text2, prefBg: active === 'preferences' ? t.accentBg : 'transparent' };
  }
}
</script>
</body>
</html>
