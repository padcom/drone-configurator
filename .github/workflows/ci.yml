name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every Monday the whole suite, macOS and Windows included, whatever changed.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request ends its run that is still going (its result is of a commit nobody looks at any more); main's runs
# all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The work is split into parallel jobs (step 3 of shared/decisions/drone-configurator-ci-strategy.md), so that the wall time is that of
# the slowest part and each job has a runner of its own, and its memory (the backend tests and the host build no longer share one).
# A pull request runs what its change needs (`select`, .github/ci-select.mjs and e2e-map.json; whatever it cannot place selects
# everything); main, the weekly run and a manual one run everything. The shards are split by measured times (.github/shard.mjs,
# test-times.json). `ci-gate` is the one check that says the whole of it passed.
#
# Common to the jobs on Linux (x64 and arm64): the `setup` action (siblings, pnpm, Node, the framework, the contract, Pico), a
# `Step times` step (each job's time per step in its summary), and its logs kept as an artifact. The macOS and Windows jobs run the
# frontend only, and not on pull requests (they gate 1.0.0, not a PR: main and the weekly run have them).
jobs:
  # What the change needs, for the jobs below: `backend` and `e2e` are `all` or a list of names (empty: none), `sitl` whether a
  # SITL spec is among them. A push, the weekly run and a manual one select everything. Its summary says what and why.
  select:
    name: select
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      e2e: ${{ steps.select.outputs.e2e }}
      sitl: ${{ steps.select.outputs.sitl }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What the change needs
        id: select
        run: bash .github/ci-select.sh

  # Format and lint of the backend (`pico lint` builds it), ESLint, vue-tsc, tsc on e2e, and all the frontend unit tests.
  lint:
    name: lint and unit (${{ matrix.target }})
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        # Explicitly bash, which GitHub runs with -eo pipefail: a failing test isn't hidden by tee.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: drone-configurator
      - uses: ./drone-configurator/.github/actions/setup
        with:
          target: ${{ matrix.target }}
          pico: 'true'
      - name: Lint
        working-directory: drone-configurator
        run: pico --version && pnpm lint
      - name: Frontend unit tests
        working-directory: drone-configurator
        run: |
          pnpm --filter ./apps/frontend test 2>&1 | tee "$RUNNER_TEMP/unit.log"
          bash "$GITHUB_WORKSPACE/drone-configurator/.github/tests-ran.sh" "$RUNNER_TEMP/unit.log" 'Tests +[1-9][0-9]* passed'
      - name: Step times
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash drone-configurator/.github/step-times.sh

  # The backend's tests (`pico test`): each file in a process of its own. The files the change needs are split in three shards by
  # their measured times (.github/shard.mjs), each with a runner of its own, so the shards end together.
  backend:
    name: backend ${{ matrix.shard }}/3 (${{ matrix.target }})
    needs: select
    if: ${{ needs.select.outputs.backend != '' }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64]
        shard: [1, 2, 3]
        include:
          # test-jobs: how many files of the shard run at once (`pico test -j`). Before Pico 0.10.0 the build of a test file took 4
          # to 8 GB and two at once ran out of the runner's 16 GB (runs 43456254640, 43540418787), so it was one; 0.10.0 lowers a
          # build in about 640 MB (pico-lang#134), so two run at once again. The probe below still prints the memory as it goes.
          - { target: linux-x64, runner: ubuntu-24.04, test-jobs: 2 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, test-jobs: 2 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: drone-configurator
      - uses: ./drone-configurator/.github/actions/setup
        with:
          target: ${{ matrix.target }}
          pico: 'true'
      # The probe prints a line of memory use every 10 s into the log, so that whatever is there when the step dies (a runner that
      # runs out of memory has been cancelled with no output before: run 42735673539) shows how it went.
      - name: Backend tests
        working-directory: drone-configurator
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 3
          JOBS: ${{ matrix.test-jobs }}
          SELECTED: ${{ needs.select.outputs.backend }}
        run: |
          probe() {
            # Not under the step's -e and pipefail: a reading that fails (a pipe closed early) must not end the probe, which
            # is only worth anything while it keeps printing.
            set +e +o pipefail
            local n=0
            while true; do
              echo "probe $(date +%T) $(free -m | awk '/^Mem:/ {print "used=" $3 "MB available=" $7 "MB"}') load=$(cut -d' ' -f1 /proc/loadavg)"
              if [ $((n % 3)) -eq 0 ]; then
                ps -eo rss,etimes,args --sort=-rss | sed -n '1,4p' | cut -c1-150 | sed 's/^/probe   /' || true
              fi
              n=$((n + 1))
              sleep 10
            done
          }
          mapfile -t files < <(node .github/shard.mjs --kind backend --shard "$SHARD" --of "$SHARDS" --only "$SELECTED")
          echo "shard $SHARD of $SHARDS: ${#files[@]} files: ${files[*]}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "nothing the change needs is in this shard"
            exit 0
          fi
          echo "probe machine: $(nproc) CPUs, backend test jobs: $JOBS"
          free -m
          probe &
          probe_pid=$!
          trap 'kill "$probe_pid" 2>/dev/null || true' EXIT
          (cd apps/backend && pico test "${files[@]}" -j "$JOBS") 2>&1 | tee "$RUNNER_TEMP/backend.log"
          echo "probe after the tests:"
          free -m
          bash "$GITHUB_WORKSPACE/drone-configurator/.github/tests-ran.sh" "$RUNNER_TEMP/backend.log" 'tests: [1-9][0-9]* passed'
      - name: Why the tests ended (memory, the kernel's log)
        if: ${{ always() }}
        run: |
          free -m
          if log=$(sudo dmesg 2>&1); then
            echo "$log" | grep -i -E 'out of memory|oom-kill|killed process' | tail -20 || echo "the kernel log has no out-of-memory lines"
          else
            echo "dmesg itself failed, so the kernel log could not be read: $log"
          fi
      - name: Step times
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash drone-configurator/.github/step-times.sh
      - name: Keep the test log
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-${{ matrix.target }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend.log
          if-no-files-found: ignore
          retention-days: 14

  # The window e2e (`pnpm e2e` = `pico-desktop test --e2e`) with the fake vehicles: the specs that don't start a SITL (told by
  # what a spec uses), those the change needs, in two shards by their measured times.
  e2e:
    name: e2e ${{ matrix.shard }}/2 (${{ matrix.target }})
    needs: select
    if: ${{ needs.select.outputs.e2e != '' }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64]
        shard: [1, 2]
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: drone-configurator
      - uses: ./drone-configurator/.github/actions/setup
        with:
          target: ${{ matrix.target }}
          pico: 'true'
      - uses: ./drone-configurator/.github/actions/window
        with:
          target: ${{ matrix.target }}
      - name: End-to-end tests in the real window (fake vehicles)
        working-directory: drone-configurator
        env:
          PICO_DESKTOP_HOST: ${{ github.workspace }}/pico-desktop/build/cef/runtime/cef-host/pico-desktop-host
          SHARD: ${{ matrix.shard }}
          SELECTED: ${{ needs.select.outputs.e2e }}
        run: |
          mapfile -t specs < <(node .github/shard.mjs --kind e2e --shard "$SHARD" --of 2 --only "$SELECTED")
          echo "shard $SHARD of 2: ${#specs[@]} specs: ${specs[*]}"
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "no spec the change needs is in this shard"
            exit 0
          fi
          xvfb-run -a pnpm e2e "${specs[@]}" | tee "$RUNNER_TEMP/e2e.log"
          bash "$GITHUB_WORKSPACE/drone-configurator/.github/tests-ran.sh" "$RUNNER_TEMP/e2e.log" 'Tests +[1-9][0-9]* passed'
      - name: Step times
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash drone-configurator/.github/step-times.sh
      - name: Keep the test log
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log-${{ matrix.target }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e.log
          if-no-files-found: ignore
          retention-days: 14

  # The window e2e that start an ArduPilot SITL, at the pinned ref (.github/workflows/sitl-e2e.yml), when the change needs one.
  e2e-sitl:
    name: e2e SITL
    needs: select
    if: ${{ needs.select.outputs.sitl == 'true' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sitl-e2e.yml
    with:
      specs: ${{ needs.select.outputs.e2e }}

  # The backend doesn't link on these yet: padcom/serialport is Linux only, and `pico-desktop test --e2e` assumes Linux. The
  # "Not run here" step says so on every run.
  frontend-only:
    name: ${{ matrix.target }} (frontend only)
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, runner: macos-15 }
          - { target: windows-x64, runner: windows-2025 }
          - { target: windows-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: drone-configurator
      - uses: ./drone-configurator/.github/actions/setup
        with:
          target: ${{ matrix.target }}
      - name: Not run here
        run: echo "::warning::${{ matrix.target }} runs the frontend's type check and unit tests only. The backend's lint and tests and the E2E suite are not run, because the backend doesn't link on this platform yet."
      - name: Frontend type check
        working-directory: drone-configurator/apps/frontend
        # vue-tsc (the package's own `typecheck`, as `pnpm lint` runs it on Linux): plain tsc can't read .vue files.
        run: |
          pnpm typecheck
          pnpm exec tsc --noEmit -p e2e
      - name: Frontend unit tests
        working-directory: drone-configurator/apps/frontend
        run: |
          pnpm test | tee "$RUNNER_TEMP/unit.log"
          bash "$GITHUB_WORKSPACE/drone-configurator/.github/tests-ran.sh" "$RUNNER_TEMP/unit.log" 'Tests +[1-9][0-9]* passed'

  # The one check that says the whole of it passed: `select` must have succeeded, and every other job it needs must have succeeded
  # or been skipped as the change does not need it (a failed or cancelled one fails it); it runs even when one of them failed. It is
  # what branch protection would require, and it keeps working when jobs are added here (add them to `needs`).
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [select, lint, backend, e2e, e2e-sitl, frontend-only]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '.select.result == "success" and all(.[]; .result == "success" or .result == "skipped")' > /dev/null
