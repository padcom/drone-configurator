name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # SHADOW MODE (step 1 of shared/decisions/drone-configurator-ci-strategy.md): says which tests the change would need and
  # writes it to the job summary. Nothing reads the outputs yet: every job below still runs everything, and this job cannot
  # fail the run (the step is continue-on-error), so it gates nothing. Compare its summary with what failed, on the next
  # PRs, before selection is switched on.
  select:
    name: select (shadow)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What the change would need
        continue-on-error: true
        run: bash .github/ci-select.sh --shadow

  ci:
    name: ${{ matrix.target }} (${{ matrix.backend && 'full' || 'frontend only' }})
    # Only this job, and only to read its own run's step times (.github/step-times.sh); nothing broader, nothing for `select`.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # test-jobs: how many backend test files run at once (`pico test -j`). The probe in "Unit and backend tests" showed
          # why it is 2: each `pico run` of a backend test file takes 1.8 GB growing to 3.8 GB, so the default of one per CPU
          # (4 on these runners) needs about 15 GB of the 16 the runner has (run 42735673539, linux-x64: used=8077MB, then
          # used=15774MB available=209MB ten seconds later, and the step was killed; the "operation was canceled" of
          # linux-arm64 before it was the same). With 2 at once linux-arm64 passed that run. The macOS and Windows jobs run no
          # backend tests, so they have none.
          - { target: linux-x64, runner: ubuntu-24.04, backend: true, test-jobs: 2 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, backend: true, test-jobs: 2 }
          # The backend doesn't link on these yet: padcom/serialport is Linux only, and
          # `pico-desktop test --e2e` assumes Linux. The "Not run here" step says so on every run.
          - { target: macos-arm64, runner: macos-15, backend: false }
          - { target: windows-x64, runner: windows-2025, backend: false }
          - { target: windows-arm64, runner: windows-11-arm, backend: false }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        # Explicitly bash, which GitHub runs with -eo pipefail: a failing test isn't hidden by tee.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: drone-configurator
      # The siblings, next to this repo, so the link: and workspace paths resolve unchanged. Each
      # is its default branch: none has a published package to pin, and this app is developed
      # against them as they are. All are public, so no token is needed. "Sibling revisions" logs
      # what a run used.
      - uses: actions/checkout@v4
        with:
          repository: padcom/pico-desktop
          path: pico-desktop
      - uses: actions/checkout@v4
        with:
          repository: padcom/pico-mavlink
          path: pico-mavlink
      - uses: actions/checkout@v4
        with:
          repository: padcom/pico-serialport
          path: pico-serialport
      - name: Sibling revisions
        run: for r in pico-desktop pico-mavlink pico-serialport; do echo "$r $(git -C "$r" rev-parse HEAD)"; done

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: pico-desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: pico-desktop/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            pico-desktop/pnpm-lock.yaml
            drone-configurator/pnpm-lock.yaml

      - name: Install the framework and build its packages
        working-directory: pico-desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter pico-desktop... build
          pnpm --filter './packages/*' build
      - name: Install the app and generate its contract
        working-directory: drone-configurator
        run: |
          pnpm install --frozen-lockfile
          pnpm generate

      - name: Not run here
        if: ${{ !matrix.backend }}
        run: echo "::warning::${{ matrix.target }} runs the frontend's type check and unit tests only. The backend's lint and tests and the E2E suite are not run, because the backend doesn't link on this platform yet."
      - name: Frontend type check
        if: ${{ !matrix.backend }}
        working-directory: drone-configurator/apps/frontend
        # vue-tsc (the package's own `typecheck`, as `pnpm lint` runs it on Linux): plain tsc can't read .vue files.
        run: |
          pnpm typecheck
          pnpm exec tsc --noEmit -p e2e
      - name: Frontend unit tests
        if: ${{ !matrix.backend }}
        working-directory: drone-configurator/apps/frontend
        run: |
          pnpm test | tee "$RUNNER_TEMP/unit.log"
          bash "$GITHUB_WORKSPACE/drone-configurator/.github/tests-ran.sh" "$RUNNER_TEMP/unit.log" 'Tests +[1-9][0-9]* passed'

      - name: Install the pinned Pico
        if: ${{ matrix.backend }}
        env:
          GH_TOKEN: ${{ github.token }}
        # Fails the job if the pin or its release is missing: nothing below is optional.
        run: |
          v=$(jq -er .pico.minimum pico-desktop/toolchain.json)
          gh release download "v$v" -R padcom/pico-lang -p "pico-$v-${{ matrix.target }}.tar.gz" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/pico"
          tar -xzf "$RUNNER_TEMP/pico-$v-${{ matrix.target }}.tar.gz" -C "$RUNNER_TEMP/pico"
          dirname "$(find "$RUNNER_TEMP/pico" -type f -name pico -perm -u+x | head -1)" >> "$GITHUB_PATH"
      - name: Lint
        if: ${{ matrix.backend }}
        working-directory: drone-configurator
        run: pico --version && pnpm lint
      # `pnpm test` (pico-desktop test) is the contract generation (done above), then Vitest, then `pico test .` in the
      # backend, each backend file in a process of its own, as many at once as there are CPUs. The two are run here
      # directly so that the backend's parallelism can be set, and so that a probe can run beside them: this step has been
      # cancelled on linux-arm64, always during the backend tests and with no output ("The operation was canceled"),
      # while linux-x64 passes, which looks like a runner that runs out of memory. The probe prints a line of memory use
      # every 10 s into the log, so that whatever is there when the step dies shows how it went.
      - name: Unit and backend tests
        if: ${{ matrix.backend }}
        working-directory: drone-configurator
        env:
          # How many backend test files run at once (empty: pico's default, one per CPU).
          BACKEND_TEST_JOBS: ${{ matrix.test-jobs }}
        run: |
          probe() {
            # Not under the step's -e and pipefail: a reading that fails (a pipe closed early) must not end the probe, which
            # is only worth anything while it keeps printing.
            set +e +o pipefail
            local n=0
            while true; do
              echo "probe $(date +%T) $(free -m | awk '/^Mem:/ {print "used=" $3 "MB available=" $7 "MB"}') load=$(cut -d' ' -f1 /proc/loadavg)"
              if [ $((n % 3)) -eq 0 ]; then
                ps -eo rss,etimes,args --sort=-rss | sed -n '1,4p' | cut -c1-150 | sed 's/^/probe   /' || true
              fi
              n=$((n + 1))
              sleep 10
            done
          }
          echo "probe machine: $(nproc) CPUs, backend test jobs: ${BACKEND_TEST_JOBS:-default}"
          free -m
          probe &
          probe_pid=$!
          trap 'kill "$probe_pid" 2>/dev/null || true' EXIT
          status=0
          pnpm --filter ./apps/frontend test 2>&1 | tee "$RUNNER_TEMP/unit.log" || status=$?
          (cd apps/backend && pico test . ${BACKEND_TEST_JOBS:+-j "$BACKEND_TEST_JOBS"}) 2>&1 | tee -a "$RUNNER_TEMP/unit.log" || status=$?
          echo "probe after the tests:"
          free -m
          test "$status" -eq 0
          bash "$GITHUB_WORKSPACE/drone-configurator/.github/tests-ran.sh" "$RUNNER_TEMP/unit.log" 'Tests +[1-9][0-9]* passed'
          bash "$GITHUB_WORKSPACE/drone-configurator/.github/tests-ran.sh" "$RUNNER_TEMP/unit.log" 'tests: [1-9][0-9]* passed'
      - name: Why the tests ended (memory, the kernel's log)
        if: ${{ always() && matrix.backend }}
        run: |
          free -m
          if log=$(sudo dmesg 2>&1); then
            echo "$log" | grep -i -E 'out of memory|oom-kill|killed process' | tail -20 || echo "the kernel log has no out-of-memory lines"
          else
            echo "dmesg itself failed, so the kernel log could not be read: $log"
          fi

      # The same steps as pico-desktop's own CI, for the host E2E runs in.
      - name: Cache the pinned CEF
        if: ${{ matrix.backend }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/pico-desktop/cef
          key: cef-${{ matrix.target }}-${{ hashFiles('pico-desktop/toolchain.json') }}
      - name: Cache the host build
        if: ${{ matrix.backend }}
        id: host
        uses: actions/cache@v4
        with:
          path: pico-desktop/build/cef
          key: cef-host-${{ matrix.target }}-${{ hashFiles('pico-desktop/toolchain.json', 'pico-desktop/CMakeLists.txt', 'pico-desktop/CMakePresets.json', 'pico-desktop/runtime/**') }}
      - name: Runtime libraries and Xvfb
        if: ${{ matrix.backend }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libx11-dev libnss3 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libgtk-3-0t64
      - name: Allow unprivileged user namespaces (the sandbox needs them; it's never disabled)
        if: ${{ matrix.backend }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the host
        if: ${{ matrix.backend && steps.host.outputs.cache-hit != 'true' }}
        working-directory: pico-desktop
        run: pnpm cef:configure && pnpm cef:build
      # ArduPilot SITL for the E2E suites that need a simulator. The ref is pinned in one line,
      # .github/ardupilot-ref (a commit or a tag). The binary is cached by ref and target, so only the
      # first run after a change to the ref, to sitl-build.sh or to this step's key builds it.
      - name: Pinned ArduPilot ref
        if: ${{ matrix.backend }}
        id: ardupilot
        run: echo "ref=$(tr -d '[:space:]' < drone-configurator/.github/ardupilot-ref)" >> "$GITHUB_OUTPUT"
      # Restore and save are separate steps: a cache is only saved when the whole job succeeds, so with
      # actions/cache a failing E2E would throw the build away. Saving right after the build keeps it.
      - name: Restore the SITL build
        if: ${{ matrix.backend }}
        id: sitl
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sitl
          key: sitl-copter-${{ matrix.target }}-${{ steps.ardupilot.outputs.ref }}-${{ hashFiles('drone-configurator/.github/sitl-build.sh', 'drone-configurator/.github/sitl-requirements.txt') }}
      - name: Build SITL (cache miss)
        if: ${{ matrix.backend && steps.sitl.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential g++ gawk git make wget pkg-config libtool-bin python3-dev python3-venv
          bash drone-configurator/.github/sitl-build.sh "${{ steps.ardupilot.outputs.ref }}" copter "$RUNNER_TEMP/sitl" "$RUNNER_TEMP/sitl-work"
      - name: Save the SITL build
        if: ${{ matrix.backend && steps.sitl.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sitl
          key: ${{ steps.sitl.outputs.cache-primary-key }}
      - name: SITL is there
        if: ${{ matrix.backend }}
        run: |
          test -x "$RUNNER_TEMP/sitl/arducopter"
          echo "SITL ${{ steps.ardupilot.outputs.ref }}, cache hit: ${{ steps.sitl.outputs.cache-hit == 'true' }}"
      - name: End-to-end tests in the real window
        if: ${{ matrix.backend }}
        working-directory: drone-configurator
        env:
          PICO_DESKTOP_HOST: ${{ github.workspace }}/pico-desktop/build/cef/runtime/cef-host/pico-desktop-host
          SITL_BINARY: ${{ runner.temp }}/sitl/arducopter
        run: |
          xvfb-run -a pnpm e2e | tee "$RUNNER_TEMP/e2e.log"
          bash "$GITHUB_WORKSPACE/drone-configurator/.github/tests-ran.sh" "$RUNNER_TEMP/e2e.log" 'Tests +[1-9][0-9]* passed'
          # The SITL suites, once they are in the repo, must have run: a skipped or missing one isn't green.
          # TODO(#272): this guard only takes effect once sitl-harness.e2e.ts is on main. Check then that
          # the pattern matches vitest's line for it in this log (`✓ e2e/sitl-harness.e2e.ts (N tests)`).
          if [ -e apps/frontend/e2e/sitl-harness.e2e.ts ]; then
            bash "$GITHUB_WORKSPACE/drone-configurator/.github/tests-ran.sh" "$RUNNER_TEMP/e2e.log" '✓ e2e/sitl-harness\.e2e\.ts'
          fi

      # Measurement only (step 0 of the CI strategy): the time of each step in the job summary, and the test logs, so that
      # what takes the minutes is known before anything is split or selected. Neither can fail the job.
      - name: Step times
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash drone-configurator/.github/step-times.sh
      - name: Keep the test logs
        if: ${{ always() && matrix.backend }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/unit.log
            ${{ runner.temp }}/e2e.log
          if-no-files-found: ignore
          retention-days: 14
